  <script>
    // Inbouwversie voor de website (iframe in eazy-fix.nl/de, JKC): pad /embed of ?embed=1.
    // Duitse bot (eazyfix-bot-de): standaardtaal Duits, land Duitsland of Oostenrijk.
    // ?foto=0 verbergt de camera (besluit van Eazyfix of foto-upload aan staat).
    // Vroeg in <head>, zodat de CSS meteen de juiste modus pakt (geen flits).
    (function () {
      var q = new URLSearchParams(location.search);
      var embed = location.pathname.replace(/\/+$/, '') === '/embed' || q.get('embed') === '1';
      if (embed) document.documentElement.classList.add('embed');
      if (q.get('foto') === '0') document.documentElement.classList.add('nofoto');
      // Contextparameters van de website (zie docs/inbouw-website-jkc.md, hoofdstuk 8).
      // De server controleert ze opnieuw; hier alleen het formaat.
      var slug = function (v, max) { v = (v || '').toLowerCase().trim(); return /^[a-z0-9\/-]+$/.test(v) && v.length <= max ? v : ''; };
      var lang = (q.get('lang') || '').toLowerCase();
      window.EF_CTX = { page: slug(q.get('page'), 120), product: slug(q.get('product'), 80), klus: slug(q.get('klus'), 20), lang: ['nl', 'en', 'de'].indexOf(lang) >= 0 ? lang : 'de', country: ['de', 'at'].indexOf((q.get('country') || '').toLowerCase()) >= 0 ? (q.get('country') || '').toLowerCase() : '' };
      document.documentElement.lang = window.EF_CTX.lang;
    })();
  </script>

  <!-- Lettertype van de nieuwe eazy-fix.nl (Inter Tight), zelf meegeleverd uit public/fonts:
       geen verbinding met Google en geen IP-adres naar derden (review design 13-11-2026, punt 3 en 15).
       Variabel lettertype, latin-deel; gebruikt in de gewichten 400, 600 en 700. Licentie: fonts/OFL.txt. -->
  <link rel="preload" href="/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Inter Tight';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('/fonts/inter-tight-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    /* Merkkleuren van de nieuwe eazy-fix.nl (akkoord Ralf 13-11-2026, review design punt 3).
       Limoen (--green) alleen als vlak met donkerblauw erop (11:1), nooit als tekst op wit (1,7:1).
       Groene tekst en links op wit: --groen-tekst (5,2:1). */
    :root {
      --navy: #090b2a;
      --green: #93d801;
      --green-dark: #090b2a;
      --groen-tekst: #4e7813;
      --groen-rand: #6a9a12;
      --groen-licht: #f1f8e3;
      --ink: #18181b;
      --muted: #5f6675;
      --line: #e4e4e7;
      --bg: #f4f4f5;
      --rand-veld: #8b8b94;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--navy);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    /* Achtergrond van de losse testpagina (in het iframe niet zichtbaar) */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -2;
      /* Duitse bot: geen foto van de Nederlandse site (die toonde "REPARATIE", "VERKOOPPUNTEN"). */
      background: radial-gradient(120% 90% at 20% 10%, #1f2a6b 0%, #10153f 45%, #090b2a 100%);
      filter: none;
      transform: scale(1.1);
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(155deg, rgba(9,11,42,.86), rgba(9,11,42,.5) 45%, rgba(9,11,42,.7));
    }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .chat {
      width: 100%; max-width: 540px; height: min(90vh, 800px);
      background: #fff; border-radius: 24px; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      box-shadow: 0 30px 90px rgba(0,0,0,.5);
    }

    /* Kop */
    .top { background: var(--navy); color: #fff; padding: 10px 8px 10px 16px; min-height: 60px; display: flex; align-items: center; gap: 12px; position: relative; }
    .top .logo { height: 30px; width: auto; display: block; }
    .top .tekst { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .top .title { font-size: 16px; font-weight: 700; color: #fff; }
    .top .sub { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #c7ccda; }
    .top .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 0 rgba(147,216,1,.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(147,216,1,.6);} 70%{ box-shadow: 0 0 0 7px rgba(147,216,1,0);} 100%{ box-shadow:0 0 0 0 rgba(147,216,1,0);} }
    .top .knoppen { margin-left: auto; display: flex; align-items: center; gap: 2px; }

    /* Berichten. De kolom is in volledig scherm hooguit 760 px breed en gecentreerd
       (review design punt 13); in het gewone venster verandert er niets. */
    .gesprek { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .msgs { flex: 1; overflow-y: auto; position: relative; padding: 18px max(16px, calc((100% - 760px) / 2)); background: var(--bg); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
    .row { display: flex; gap: 9px; align-items: flex-end; }
    .row-user { justify-content: flex-end; }
    /* Duitse bot: wit EAZYFIX-icoon op donkerblauw (geen foto van Nina zoals op NL). */
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .avatar img { width: 22px; height: 22px; display: block; }
    .msg { max-width: 78%; padding: 11px 14px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
    .bot .msg { background: #fff; border: 1px solid var(--line); border-radius: 16px 16px 16px 5px; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .user .msg { background: var(--navy); color: #fff; border-radius: 16px 16px 5px 16px; font-weight: 500; }
    /* Foutmelding: rustig, met een icoon en een knop om het opnieuw te proberen (punt 7). */
    .err .msg { background: #fff4f2; color: #8a1c12; border: 1px solid #f3c7c1; border-radius: 14px; display: flex; gap: 8px; align-items: flex-start; }
    .err .msg .ficoon { flex: none; width: 18px; height: 18px; margin-top: 2px; }
    .err .msg .ftekst { min-width: 0; }
    .err .msg a { color: #8a1c12; }
    .foutacties { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0 39px; }
    .foutknop { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .foutknop:hover { background: #f4f4f5; }
    .foutknop svg { width: 16px; height: 16px; flex: none; }

    /* Regels direct onder elkaar (vragen, losse opsomming) krijgen wat lucht, zodat een
       vraag die over twee regels loopt niet in de volgende overloopt (review 10-11-2026). */
    .msg .lsp { display: block; height: 7px; }
    /* Opmaak van een afgerond antwoord (verzoek Ralf 12-11-2026): elke regel een eigen blok,
       opsommingen met een groen bolletje, genummerde stappen met een groen rondje. */
    .msg > .regel, .msg > .punten, .msg > .stappen { display: block; margin: 7px 0 0; }
    .msg > :first-child { margin-top: 0; }
    .msg > .na-wit { margin-top: 14px; }
    .msg .punten, .msg .stappen { list-style: none; padding: 0; }
    .msg .punten li, .msg .stappen li { position: relative; margin-top: 6px; }
    .msg .punten li:first-child, .msg .stappen li:first-child { margin-top: 0; }
    .msg .punten li { padding-left: 18px; }
    .msg .punten li::before { content: ''; position: absolute; left: 3px; top: calc(.775em - 3.5px); width: 7px; height: 7px; border-radius: 50%; background: var(--groen-rand); }
    .msg .stappen li { padding-left: 31px; min-height: 22px; }
    .msg .stappen li + li { margin-top: 9px; }
    .msg .stappen li::before { content: attr(data-n); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: var(--navy); font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; }

    /* Keuzeknopjes onder een antwoord (verzoek Ralf 13-11-2026) en startknopjes in de
       opening (review design punt 4). Wit met een groene rand van 3:1, minstens 44 px hoog. */
    .keuzes { display: flex; flex-wrap: wrap; gap: 10px 10px; margin: 12px 0 2px 39px; }
    .keuzes.start { flex-direction: column; align-items: flex-start; gap: 8px; }
    .keuze { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font: inherit; font-size: 15px; font-weight: 600; line-height: 1.25; text-align: left; color: var(--navy); background: #fff; border: 1.5px solid var(--groen-rand); border-radius: 999px; padding: 10px 18px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: background .12s, border-color .12s, transform .08s; }
    .keuze:hover { background: var(--groen-licht); }
    .keuze:focus-visible { background: var(--groen-licht); outline: 2px solid var(--navy); outline-offset: 2px; }
    .keuze:active { transform: scale(.97); }
    .keuze .kicoon { font-size: 17px; line-height: 1; }

    /* Winkelkaartjes onder een antwoord (uit de winkellijst, niet door de AI geschreven) */
    .winkels { display: flex; flex-direction: column; gap: 8px; margin: 2px 0 0 39px; max-width: calc(78% + 8px); }
    .winkel { display: grid; grid-template-columns: 34px 1fr auto; column-gap: 10px; row-gap: 10px; align-items: center; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); color: var(--ink); }
    .winkel .wpin { width: 34px; height: 34px; border-radius: 50%; background: var(--groen-licht); color: var(--groen-tekst); display: flex; align-items: center; justify-content: center; }
    .winkel .wpin svg { width: 18px; height: 18px; }
    .winkel .wbody { min-width: 0; }
    .winkel .wnaam { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .winkel .wadres { font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
    .winkel .wkm { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; background: #f4f4f5; border-radius: 999px; padding: 3px 9px; }
    .winkel .wknoppen { grid-column: 2 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
    .winkel .wknop { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--groen-rand); background: #fff; color: var(--navy); font-size: 14px; font-weight: 600; text-decoration: none; transition: background .12s, border-color .12s; }
    .winkel .wknop:hover { background: var(--groen-licht); }
    .winkel .wknop:focus-visible { background: var(--groen-licht); outline: 2px solid var(--navy); outline-offset: 2px; }
    .winkel .wknop svg { width: 16px; height: 16px; color: var(--groen-tekst); }
    /* Tijd onder een bericht: alleen onder het laatste bericht van een reeks (punt 15). */
    .msg-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .msg-meta-bot { text-align: left; margin-left: 39px; }
    .msg-meta-user { text-align: right; }
    .bubble-wrap.w-bot:has(+ .bubble-wrap.w-bot) > .msg-meta, .bubble-wrap.w-user:has(+ .bubble-wrap.w-user) > .msg-meta { display: none; }

    /* Typende puntjes */
    .analyzing { color: #6b7280; font-style: italic; }
    .typing { display: inline-flex; gap: 4px; padding: 2px 0; vertical-align: middle; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #8b8b94; animation: blink 1.3s infinite both; }
    .typing span:nth-child(2){ animation-delay:.2s;} .typing span:nth-child(3){ animation-delay:.4s;}
    @keyframes blink { 0%,80%,100%{ opacity:.25; transform: translateY(0);} 40%{ opacity:1; transform: translateY(-3px);} }
    /* Wachten op een opzoeking (punt 8): de puntjes blijven, met een korte uitleg ernaast. */
    .wachten { display: inline-flex; align-items: center; gap: 10px; }
    .wachten .wachttekst { color: var(--muted); font-size: 14px; }

    /* Voortgang tijdens de foto-analyse (punt 2): kaartje met verwachting, balk en stappen. */
    .fotokaart { display: flex; flex-direction: column; gap: 10px; min-width: min(250px, 100%); white-space: normal; }
    .fotokaart .kop { font-weight: 700; font-size: 15px; color: var(--ink); }
    .fotokaart .duur { font-size: 13.5px; color: var(--muted); margin-top: -6px; }
    .balk { height: 6px; background: #e4e4e7; border-radius: 999px; overflow: hidden; }
    .balk span { display: block; height: 100%; width: 8%; background: var(--green); border-radius: 999px; transition: width .5s ease-out; }
    .fases { display: flex; flex-direction: column; gap: 5px; margin: 2px 0; }
    .fases .stap { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #71717a; transition: color .2s; }
    .fases .stap.actief { color: var(--ink); font-weight: 600; }
    .fases .stap.klaar { color: var(--groen-tekst); }
    .fases .stap .mark { width: 18px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .fases .stap .mark svg { display: block; }
    .fases .stap .mark .typing span { width: 4px; height: 4px; }
    .fases .stap .mark .open { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #8b8b94; }

    /* Duimpjes per antwoord, TIJDELIJK terug voor de testfase (28-10-2026, verzoek Nina).
       Uitzetten: DUIMPJES_TESTFASE = false in het script. */
    .fb { display: flex; gap: 6px; align-items: center; margin: 16px 0 4px 39px; flex-wrap: wrap; }
    .fb button { display: inline-flex; align-items: center; justify-content: center; min-height: 26px; padding: 4px 9px; border: 1px solid #d6d9e0; border-radius: 9px; background: #fff; color: var(--navy); cursor: pointer; font-size: 13px; line-height: 1; }
    .fb .sel { background: var(--navy); color: #fff; border-color: var(--navy); }
    .fb .fbsend { background: var(--navy); color: #fff; border: 0; font-weight: 600; }
    .fb .fbc { flex: 1; min-width: 130px; padding: 6px 9px; border: 1px solid #d6d9e0; border-radius: 9px; font: inherit; font-size: 13px; }
    .fb .fbmsg { font-size: 12px; color: var(--muted); }

    /* Gesprek afronden en beoordelen (21-10-2026). Sinds de review van 13-11-2026 een klein
       tekstlinkje onder het invoerveld in plaats van een grote knop erboven (punt 9). */
    .eindrij { display: none; justify-content: center; }
    .chat.beantwoord .eindrij { display: flex; }
    .chat.beeindigd .composer { display: none; }
    .eindknop { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin: 0 0 -10px; padding: 0 12px; background: none; border: 0; font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .eindknop:hover { color: var(--navy); }
    .eindknop:focus-visible, .smileys button:focus-visible, .beoordeling button:focus-visible, .nieuwlink:focus-visible, .lees-verder:focus-visible, .foutknop:focus-visible, .photo-menu button:focus-visible, .premove:focus-visible, .attach:focus-visible, #send:focus-visible, .video:focus-visible, .msg a:focus-visible, .opening-noot a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .beoordeling { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; margin: 4px 0 0 39px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .beoordeling .vraag { font-weight: 700; color: var(--ink); font-size: 16px; }
    .beoordeling .sub { font-size: 13.5px; color: var(--muted); margin-top: -8px; }
    .smileys { display: flex; gap: 14px; }
    .smileys button { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
    .smileys .gezicht { width: 62px; height: 62px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 2px solid transparent; transition: transform .15s ease-out, border-color .15s, box-shadow .15s; }
    .smileys .gezicht svg { display: block; }
    .smileys .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
    .smileys [data-oordeel="blij"] .gezicht { background: #eef6e0; color: var(--groen-tekst); }
    .smileys [data-oordeel="neutraal"] .gezicht { background: #fdf2d9; color: #a1620a; }
    .smileys [data-oordeel="ontevreden"] .gezicht { background: #fde8e6; color: #c23b31; }
    .smileys button:hover .gezicht { transform: translateY(-2px) scale(1.04); }
    .smileys button.sel .gezicht { border-color: currentColor; box-shadow: 0 0 0 4px rgba(9,11,42,.06); transform: scale(1.06); }
    .smileys button.sel .lbl { color: var(--ink); }
    .smileys.gekozen button:not(.sel) { opacity: .45; }
    .smileys button:disabled { cursor: default; }
    .beoordeling .toelichting { display: none; flex-direction: column; gap: 10px; width: 100%; }
    .beoordeling .toelichting.aan { display: flex; }
    .beoordeling textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--rand-veld); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical; min-height: 64px; }
    .beoordeling textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(9,11,42,.12); }
    .beoordeling .verstuur, .beoordeling .nieuw { align-self: flex-start; min-height: 44px; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; font-size: 15px; font-weight: 700; background: var(--green); color: var(--navy); cursor: pointer; transition: filter .15s; }
    .beoordeling .verstuur:hover, .beoordeling .nieuw:hover { filter: brightness(.94); }
    .beoordeling button:disabled { opacity: .5; cursor: default; }
    .beoordeling .dank { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; font-weight: 600; }
    .beoordeling .dank svg { color: var(--groen-tekst); flex: none; }
    .beoordeling .fout { font-size: 13px; color: #b42318; }
    .beoordeling .fout:empty { display: none; }
    /* Lichte vraag na 10 seconden stilte (besluit Ralf 14-11-2026): één regeltje onder het
       laatste antwoord met drie kleine smileys, zonder kaart. Zelfde oordelen en kleuren als
       de kaart bij "Gesprek afronden"; de labels staan in aria-label en title. */
    .peil { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin: 4px 0 0 39px; max-width: calc(78% + 8px); animation: peilIn .4s ease-out; }
    @keyframes peilIn { from { opacity: 0; } to { opacity: 1; } }
    .peil .peilvraag { font-size: 13.5px; color: var(--muted); margin-right: 2px; }
    .peil .smileys { gap: 0; }
    .peil .smileys button { min-width: 44px; min-height: 44px; padding: 4px; justify-content: center; }
    .peil .smileys .gezicht { width: 34px; height: 34px; border-width: 1.5px; }
    .peil .smileys .gezicht svg { width: 24px; height: 24px; }
    .peil .toelichting { display: none; flex-direction: column; gap: 8px; width: 100%; margin-top: 4px; }
    .peil .toelichting.aan { display: flex; }
    .peil textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--rand-veld); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 16px; resize: vertical; min-height: 56px; }
    .peil textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(9,11,42,.12); }
    .peil .verstuur { align-self: flex-start; min-height: 44px; border: 0; border-radius: 12px; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: 700; background: var(--green); color: var(--navy); cursor: pointer; }
    .peil .verstuur:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .peil button:disabled { opacity: .5; cursor: default; }
    .peil .fout { width: 100%; font-size: 13px; color: #b42318; }
    .peil .fout:empty { display: none; }
    .peil .dank { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
    .peil .dank svg { color: var(--groen-tekst); flex: none; }
    /* Gegevens na de gratis foto's (27-10-2026) */
    .gegevens { gap: 12px; }
    .gegevens form { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .gegevens .veld { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; color: var(--ink); }
    .gegevens .veld input { border: 1.5px solid var(--rand-veld); border-radius: 12px; padding: 10px 12px; min-height: 44px; font: inherit; font-size: 16px; font-weight: 400; color: var(--ink); width: 100%; box-sizing: border-box; }
    .gegevens .veld input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(9,11,42,.12); }
    .gegevens .vink { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: var(--ink); cursor: pointer; }
    .gegevens .vink input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--navy); }
    .gegevens .vink a { color: var(--groen-tekst); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .gegevens .verplicht { font-size: 12.5px; color: var(--muted); }

    /* Invoer */
    .composer { padding: 10px max(12px, calc((100% - 760px) / 2)) 8px; border-top: 1px solid var(--line); background: #fff; position: relative; }
    form#f { display: flex; align-items: flex-end; gap: 6px; background: #fff; border: 1.5px solid var(--rand-veld); border-radius: 18px; padding: 4px; }
    form#f:focus-within { border-color: var(--navy); }
    .attach { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; color: #52525b; flex: 0 0 auto; background: none; border: 0; padding: 0; -webkit-appearance: none; appearance: none; transition: background .15s, color .15s; }
    .attach:hover { background: #f4f4f5; color: var(--navy); }
    .attach.has-file { color: var(--groen-tekst); }
    #photo, #photoCam { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    .photo-menu { position: absolute; left: 12px; bottom: 64px; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 6px; min-width: 200px; }
    .photo-menu[hidden] { display: none; }
    .photo-menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; background: none; border: 0; padding: 11px 12px; border-radius: 8px; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; text-align: left; }
    .photo-menu button:hover { background: #f4f4f5; }
    .photo-menu svg { flex: 0 0 auto; color: var(--groen-tekst); }
    textarea#in { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; font: inherit; font-size: 16px; line-height: 1.4; max-height: 120px; padding: 11px 4px; outline: none; color: var(--ink); }
    textarea#in::placeholder, .beoordeling textarea::placeholder { color: #71717a; }
    #send { width: 44px; height: 44px; flex: 0 0 auto; border: 0; border-radius: 12px; background: var(--green); color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #send svg { width: 20px; height: 20px; }
    #send:disabled { opacity: .5; cursor: default; }
    .teller { text-align: right; font-size: 12px; color: var(--muted); padding: 4px 6px 0; }
    .teller[hidden] { display: none; }
    .credit { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0 2px; }
    .credit b { color: var(--muted); font-weight: 600; }

    /* Opening: korte AI-noot onder de welkomstzin (punt 4) */
    .opening-noot { font-size: 12.5px; line-height: 1.45; color: var(--muted); margin: 2px 0 6px 39px; max-width: 78%; }
    .opening-noot a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    /* Bewaard gesprek teruggezet (punt 12): klein linkje om opnieuw te beginnen. */
    .nieuwrij { display: flex; justify-content: center; margin: -6px 0 -4px; }
    .nieuwlink { min-height: 44px; padding: 0 12px; background: none; border: 0; font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
    .nieuwlink:hover { color: var(--navy); }

    /* Knop "Lees verder" als de klant niet onderaan staat (punt 1). */
    .lees-verder { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 20; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 999px; background: var(--navy); color: #fff; font: inherit; font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(9,11,42,.3); cursor: pointer; }
    .lees-verder[hidden] { display: none; }

    /* Productnaam in de antwoordtekst: vette, onderstreepte link in plaats van een blokje (punt 6). */
    .product-link {
      color: var(--groen-tekst); font-weight: 700;
      text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px;
      white-space: normal;
    }
    .product-link:hover { color: var(--navy); }
    .site-link { color: var(--groen-tekst); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
    .site-link:hover { color: var(--navy); }

    /* Videokaartje onder een antwoord (link naar YouTube-uitleg) */
    .videos { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 0 39px; }
    .video { display: flex; align-items: stretch; gap: 0; padding: 0; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .15s, box-shadow .15s; }
    .video:hover { border-color: var(--groen-rand); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .video .vthumb { position: relative; flex: none; width: 104px; align-self: stretch; background-color: #eef0f2; overflow: hidden; }
    .video .vthumbimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .video .vthumb-fallback { background: linear-gradient(135deg, #2b2b2b, #4a4a4a); }
    .video .vplay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,0,0,.92); color: #fff; font-size: 12px; padding-left: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .video .vbody { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex: 1; min-width: 0; padding: 10px 12px; }
    .video .vtxt { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video .vcta { color: var(--groen-tekst); font-weight: 700; font-size: 13px; }

    /* Foto in user-bubbel. De bubbel heeft een vaste breedte, zodat de foto altijd
       even groot is en niet meeschuift met de lengte van het bijschrift. Zonder die
       vaste breedte bepaalt het bijschrift de bubbelbreedte en plakt een smallere
       foto links tegen de rand. Het bijschrift loopt eronder binnen dezelfde breedte. */
    .user .msg.has-photo { padding: 5px; width: 230px; max-width: 78%; }
    /* Eén foto: de bubbel krimpt mee met de foto; het bijschrift bepaalt de breedte niet. */
    .user .msg.has-photo:not(.multi) { width: fit-content; }
    .user .msg.has-photo:not(.multi) .photo-caption { width: 0; min-width: 100%; box-sizing: border-box; }
    /* Eén foto heel tonen, niet bijsnijden (test Ralf, 4-11-2026: foto niet goed te zien).
       Kleiner sinds de review van 13-11-2026 (punt 2), zodat foto en voortgang samen in
       beeld passen op een telefoon. */
    .msg img.photo {
      width: auto; max-width: 200px; height: auto; max-height: 180px;
      border-radius: 10px; display: block;
    }
    .msg img.photo + img.photo { margin-top: 5px; }
    .msg .photo-caption { padding: 6px 7px 3px; }
    .msg .fotoplek { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; color: #fff; }
    /* Meerdere foto's in één beurt: naast elkaar als tegels in plaats van een hoge stapel. */
    .msg.has-photo.multi { display: flex; flex-wrap: wrap; gap: 5px; }
    .msg.has-photo.multi img.photo { width: calc(50% - 3px); height: 105px; max-height: none; object-fit: cover; margin-top: 0; }
    .msg.has-photo.multi .photo-caption { width: 100%; }

    /* Preview van de gekozen foto, vóór verzenden */
    .preview { display: none; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 8px; background: #f4f4f5; border: 1px solid var(--line); border-radius: 14px; }
    .preview.show { display: flex; }
    .preview .pthumbs { display: flex; gap: 6px; flex: 0 0 auto; }
    .preview img { width: 46px; height: 46px; object-fit: cover; border-radius: 9px; flex: 0 0 auto; }
    .preview .pname { font-size: 14px; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Weghaalknop: 36 px zichtbaar, met een onzichtbare rand tot 44 px om op te tikken. */
    .preview .premove { position: relative; border: 0; background: #e4e4e7; color: var(--navy); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 15px; flex: 0 0 auto; }
    .preview .premove::after { content: ''; position: absolute; inset: -4px; }
    .preview .premove:hover { background: #d4d4d8; }

    @media (prefers-reduced-motion: reduce) {
      .smileys .gezicht, .eindknop, .beoordeling .verstuur, .beoordeling .nieuw, .keuze, .balk span, .fases .stap { transition: none; }
      .smileys button:hover .gezicht, .smileys button.sel .gezicht, .keuze:active { transform: none; }
      .top .dot, .typing span { animation: none; }
      .peil { animation: none; }
      .typing span { opacity: .6; }
    }

    /* Mobiel: schermvullend, geen kaartranden, toetsenbord-/adresbalk-proof */
    @media (max-width: 600px) {
      body { padding: 0; align-items: stretch; height: 100vh; height: 100dvh; }
      .chat {
        max-width: 100%; width: 100%;
        height: 100vh; height: 100dvh; max-height: 100dvh;
        border-radius: 0; box-shadow: none;
      }
      .top { padding: 8px 6px 8px 14px; gap: 10px; min-height: 56px; }
      .top .logo { height: 26px; }
      .top .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* bespaart ruimte op smalle schermen */
      .top .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .msgs { padding: 14px 12px; gap: 12px; }
      .msg { max-width: 88%; font-size: 15px; }
      .composer { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      .fb { margin-left: 8px; }
      .beoordeling { margin-left: 8px; }
      .peil { margin-left: 8px; max-width: 100%; }
      .credit { padding-bottom: calc(2px + env(safe-area-inset-bottom)); }
    }

    /* Inbouwversie (iframe in de website): vult het kader dat de site geeft, geen
       achtergrondfoto, geen losse kaart met ronde hoeken. De site bepaalt breedte en
       hoogte; de pagina geeft zijn gewenste hoogte door via postMessage (zie script). */
    html.embed, html.embed body { height: 100%; background: #fff; }
    html.embed body { padding: 0; align-items: stretch; justify-content: stretch; }
    html.embed body::before, html.embed body::after { display: none; }
    /* Sluitknop in de chatbalk (verzoek JKC, Rik 11-11-2026): alleen in de inbouwversie.
       Stuurt {type:'close'} naar de website, zodat die zijn eigen balk kan weglaten. */
    .top .sluit, .top .groot { display: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #fff; font-size: 20px; line-height: 1; cursor: pointer; align-items: center; justify-content: center; flex: 0 0 auto; }
    .top .sluit:hover, .top .groot:hover { background: rgba(255,255,255,.14); }
    .top .sluit:focus-visible, .top .groot:focus-visible { background: rgba(255,255,255,.14); outline: 2px solid var(--green); outline-offset: -3px; }
    html.embed .top .sluit { display: flex; }
    /* Fullscreen-knop (verzoek JKC, Rik 12-11-2026): alleen zichtbaar als de website
       met {type:'state', canExpand:true} laat weten dat het kan (niet op mobiel). */
    html.embed.kan-groot .top .groot { display: flex; }
    .top .groot svg { width: 18px; height: 18px; }
    html.embed .chat { max-width: none; width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
    /* ?foto=0: geen camera-knop, geen fotomenu, geen voorbeeld */
    html.nofoto .attach, html.nofoto .photo-menu, html.nofoto .preview { display: none !important; }
  </style>
</head>

    function fileToBase64(file) {
      return new Promise((res, rej) => {

    // Verklein een foto client-side vóór upload: scheelt uploadtijd op mobiel,
    // blijft ruim onder de server-bodylimiet en zet meteen om naar JPEG (lost
    // ook HEIC op waar de browser die kan decoderen, o.a. iOS Safari). Lukt de
    // omzetting niet, dan valt de aanroeper terug op het originele bestand.
    function downscaleImage(file, maxDim = 1600, quality = 0.85) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) return resolve(null);
          if (Math.max(w, h) > maxDim) {
            const s = maxDim / Math.max(w, h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            if (!blob) return resolve(null);
            const r = new FileReader();
            r.onload = () => resolve({ base64: String(r.result).split(',')[1], mimeType: 'image/jpeg' });
            r.onerror = () => resolve(null);
            r.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    }

    // de pagina de bekende meldingen (review 11-11-2026); onbekende tekst blijft staan.
    const FOUT_VERTALING = [
      [/^Te veel vragen kort achter elkaar/, 'Too many questions in a short time. Please wait a minute and try again.', 'Zu viele Fragen kurz hintereinander. Warte bitte eine Minute und versuch es dann noch einmal.'],
      [/^Te veel foto-analyses kort achter elkaar/, 'Too many photo analyses in a short time. Please wait a minute and try again.', 'Zu viele Fotoanalysen kurz hintereinander. Warte bitte eine Minute und versuch es dann noch einmal.'],
      [/^Je bericht is te lang/, 'Your message is too long (maximum 4000 characters). Please shorten it and try again.', 'Deine Nachricht ist zu lang (maximal 4000 Zeichen). Kürze sie bitte und versuch es noch einmal.'],
      [/^Je hebt vandaag het maximum aantal vragen/, "You have reached today's maximum number of questions. You can continue tomorrow; for an urgent question, call the EAZYFIX customer service on +31 (0)85 201 201 1.", 'Du hast für heute die maximale Zahl an Fragen erreicht. Morgen geht es weiter; bei einer dringenden Frage erreichst du den EAZYFIX-Kundenservice unter +31 (0)85 201 201 1.'],
      [/^Je hebt vandaag het maximum aantal foto-analyses/, "You have reached today's maximum number of photo analyses. You can send photos again tomorrow; you can still type a question.", 'Du hast für heute die maximale Zahl an Fotoanalysen erreicht. Morgen kannst du wieder Fotos schicken; eine Frage tippen geht weiterhin.'],
      [/^De assistent is vandaag erg druk/, 'The assistant is very busy today and is taking a break. Please try again tomorrow, or call the EAZYFIX customer service on +31 (0)85 201 201 1.', 'Der Assistent ist heute sehr gefragt und macht eine Pause. Versuch es morgen noch einmal oder ruf den EAZYFIX-Kundenservice unter +31 (0)85 201 201 1 an.'],
      [/^Het is nu erg druk/, 'It is very busy right now. Please wait half a minute and try again.', 'Gerade ist viel los. Warte eine halbe Minute und versuch es noch einmal.'],
      [/^De assistent is even overbelast/, 'The assistant is overloaded for a moment. Please try again in a minute. Your question is not lost.', 'Der Assistent ist gerade überlastet. Versuch es in einer Minute noch einmal. Deine Frage geht nicht verloren.'],
      [/^Er ging even iets mis/, 'Something went wrong. Please try again in a moment, or call the customer service on +31 (0)85 201 201 1.', 'Da ist etwas schiefgelaufen. Versuch es gleich noch einmal oder ruf den Kundenservice unter +31 (0)85 201 201 1 an.'],
      [/^Vernieuw de pagina/, 'Please refresh the page and try again.', 'Lade die Seite bitte neu und versuch es noch einmal.'],
      [/^Deze foto kan ik niet gebruiken/, 'I cannot use this photo. Please send a sharper photo in good daylight.', 'Dieses Foto kann ich nicht verwenden. Schick bitte ein schärferes Foto bei gutem Tageslicht.'],
      [/^Wil je meer foto's analyseren\? Vul je gegevens in en analyseer tot (\d+) extra foto's\./, "Want to analyse more photos? Fill in your details and analyse up to $1 more photos.", 'Möchtest du mehr Fotos analysieren? Gib deine Daten ein und analysiere bis zu $1 weitere Fotos.'],
      [/^(Ongeldig berichtformaat|Ongeldige aanvraag\.)/, 'Something went wrong with this message. Please try again.', 'Mit dieser Nachricht ist etwas schiefgelaufen. Versuch es bitte noch einmal.'],
    ];
    function vf(m) {
      if (!m || LANG === 'nl') return m;
      const k = LANG === 'de' ? 2 : 1;
      for (const r of FOUT_VERTALING) if (r[0].test(m)) return m.replace(r[0], r[k]).replace(/^([\s\S]*)$/, (x) => (r[0].source.includes('(\\d+)') ? x : r[k]));
      return m;
    }
    let SITE = 'https://www.eazy-fix.nl/de';
    fetch('/api/site').then(r => r.json()).then(j => { if (j && j.site) SITE = j.site; }).catch(() => {});

    // Productnaam-herkenning -> pad van de productpagina (slugs van de nieuwe site,
    // 20-10-2026). Specifieke namen vóór algemene, zodat de gecombineerde regex de
    // juiste variant pakt. Spiegelt de RULES uit src/producten.js.
    // Duitse productnamen met de paden van de nieuwe site (eazy-fix.nl/de, november 2026;
    // slugs uit src/kennis.json). Specifieke namen vóór algemene.
    const PRODUCTS = [
      { re: /premium\s*holzspachtelmasse|holzspachtelmasse/i,                       path: '/product/premium-holzspachtelmasse/' },
      { re: /(?:premium\s*)?holz\s*feinspachtel\s*one\s*shot|one\s*shot/i,        path: '/product/eazyfix-premium-one-shot/' },
      { re: /premium\s*holz\s*feinspachtel|holz\s*feinspachtel|feinspachtel/i,     path: '/product/premium-holz-fein-spachtel/' },
      { re: /premium\s*fertigspachtel|fertigspachtel/i,                            path: '/product/eazyfix-premium-fertigspachtel/' },
      { re: /holzimpr(?:ä|ae)gnierung/i,                                            path: '/product/eazyfix-holzimpraegnierung-mit-zubehoer/' },
      { re: /holzfeuchtemessger(?:ä|ae)t|feuchtemessger(?:ä|ae)t/i,                  path: '/product/feuchtigkeitsmesser/' },
      { re: /holzf(?:ä|ae)ule\s*fr(?:ä|ae)ser/i,                                    path: '/product/holzfaeule-fraeser/' },
      { re: /abt(?:ö|oe)nkonzentrat(?:e)?/i,                                        path: '/product/eazyfix-abtonkonzentrate/' },
      { re: /reinigungst(?:ü|ue)cher/i,                                             path: '/product/reinigungstucher-60-stuck/' },
      { re: /(?:holzf(?:ä|ae)ule\s*)?erweiterungsset/i,                             path: '/product/eazyfix-holzfaeule-erweiterungsset/' },
      { re: /(?:holzf(?:ä|ae)ule\s*)?starterset/i,                                  path: '/product/eazyfix-holzfaeule-starterset/' },
      { re: /(?:holzf(?:ä|ae)ule\s*)?standardset/i,                                 path: '/product/eazyfix-holzfaeule-standardset/' },
    ];

    // Gereedschap en toebehoren: de bot noemt ze vaak zonder EAZYFIX®-prefix; de namen
    // zijn specifiek genoeg om ook kaal te linken.
    const TOOLS = [
      { re: /mischbrett/i,                                   path: '/product/mischbrett/' },
      { re: /modellierstrips?/i,                             path: '/product/eazyfix-modellierstrips/' },
      { re: /kartuschenpresse/i,                             path: '/product/kartuschenpresse/' },
      { re: /nitril[\s-]*einweghandschuhe/i,                 path: '/product/nitril-einweghandschuhe-sample-size/' },
      { re: /metall[\s-]*mischspachtel/i,                    path: '/product/metall-mischspachtel/' },
      { re: /metall[\s-]*bauspachtel/i,                      path: '/product/eazyfix-metall-bauspachtel/' },
      { re: /kunststoff[\s-]*bauspachtel/i,                  path: '/product/kunststoff-bauspachtel/' },
      { re: /kunststoff[\s-]*breitspachtel/i,                path: '/product/kunststoff-breitspachtel/' },
      { re: /metall[\s-]*schmalspachtel/i,                   path: '/product/metall-schmalspachtel/' },
      { re: /komplettes\s+holzreparaturset/i,                path: '/product/komplettes-reparaturset/' },
    ];

    // Maak elke genoemde productnaam in het antwoord klikbaar als groene chip.
    // De bot sluit een antwoord waarin hij om een foto vraagt af met de marker
    // ⟦FOTO⟧ (de mobiele apps gebruiken die om een foto-knop te tonen). Deze
    // widget heeft al een vaste foto-knop, dus we halen de marker alleen weg.
    function stripFotoMarker(s) {
      return s.replace(/\s*⟦FOTO⟧\s*/g, '').replace(/\s*⟦KEUZE:[^⟧]*⟧\s*/g, '').replace(/\s*⟦[^⟧]*$/, '').trimEnd();
    }
    // Keuzeknopjes (verzoek Ralf 13-11-2026): de bot sluit een gesloten vraag af met
    // ⟦KEUZE: Hout | Muur⟧; de chat maakt daar knopjes van onder het antwoord.
    function haalKeuzes(s) {
      const m = String(s || '').match(/⟦KEUZE:([^⟧]*)⟧/);
      if (!m) return [];
      return m[1].split('|').map((k) => k.trim()).filter((k) => k && k.length <= 40).slice(0, 4);
    }
    function wegKeuzes() { document.querySelectorAll('.keuzes').forEach((el) => el.remove()); }
    // Een keuze is een tekst (die als vraag wordt verstuurd) of, bij de startknopjes in de
    // opening, { tekst, icoon, foto }: foto: true opent het fotomenu in plaats van te sturen.
    function renderKeuzes(answerEl, keuzes, opties) {
      wegKeuzes();
      if (!keuzes || keuzes.length < 2) return;
      const wrap = document.createElement('div');
      wrap.className = 'keuzes' + (opties && opties.start ? ' start' : '');
      wrap.setAttribute('role', 'group');
      if (opties && opties.label) wrap.setAttribute('aria-label', opties.label);
      for (const item of keuzes) {
        const k = typeof item === 'string' ? { tekst: item } : item;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'keuze';
        if (k.icoon) {
          const i = document.createElement('span');
          i.className = 'kicoon'; i.setAttribute('aria-hidden', 'true'); i.textContent = k.icoon;
          b.appendChild(i);
        }
        b.appendChild(document.createTextNode(k.tekst));
        b.addEventListener('click', () => {
          if (sendBtn.disabled) return;
          if (k.foto) { kiesFoto(); return; }
          wegKeuzes();
          inEl.value = k.tekst;
          document.getElementById('f').requestSubmit();
        });
        wrap.appendChild(b);
      }
      (answerEl.closest('.row') || answerEl).after(wrap);
      scrollLog();
    }

    // Alleen de EERSTE vermelding per product wordt een link (rustiger). Werkt
    // op het tekst-node van de bot-bubbel; HTML wordt veilig ge-escaped.
    // Na het afronden van een antwoord: een enkele regelovergang (twee regels direct onder
    // elkaar) wordt een klein tussenruimtetje, een lege regel blijft een gewone witregel.
    // Werkt op de tekstknopen van de bubbel zelf, na de linkify-stappen.
    // Opsomming zichtbaar maken (review 11-11-2026): regels die direct volgen op een regel
    // die eindigt op een dubbele punt ("Dit heb je nodig:") krijgen een bolletje, tot de
    // eerstvolgende witregel. Genummerde stappen en vragen zonder inleidende regel blijven
    // zoals ze zijn. Draait vóór de linkify-stappen, op de platte tekst van de bubbel.
    function opsommingTekst(text) {
      const regels = String(text).split('\n');
      let inLijst = false, groep = [];
      // Eén losse regel na een dubbele punt is geen opsomming (bijvoorbeeld een tip na
      // "deze winkels:"); pas vanaf twee regels krijgen ze een bolletje.
      const sluit = () => { if (groep.length >= 2) groep.forEach((j) => { regels[j] = '• ' + regels[j].replace(/^\s+/, ''); }); groep = []; };
      for (let i = 0; i < regels.length; i++) {
        const r = regels[i];
        // Een witregel direct na de inleidende regel ("Dit heb je nodig:") hoort nog bij de lijst.
        if (!r.trim()) { if (!(inLijst && i > 0 && /:\s*$/.test(regels[i - 1]))) { inLijst = false; sluit(); } continue; }
        if (inLijst && !/^\s*(\d+[.)]|[•\-*])\s/.test(r)) groep.push(i);
        else if (/^\s*\d+[.)]\s/.test(r)) { inLijst = false; sluit(); }
        if (/:\s*$/.test(r)) { sluit(); inLijst = true; }
      }
      sluit();
      return regels.join('\n');
    }
    function opsomming(answerEl) {
      if (!Array.from(answerEl.childNodes).every((n) => n.nodeType === 3)) return;
      const t = answerEl.textContent;
      const nieuw = opsommingTekst(t);
      if (nieuw !== t) answerEl.textContent = nieuw;
    }

    function regelRuimte(answerEl) {
      // Verdeel de bubbel in regels (de linkify-stappen kunnen <a>-knopen midden in een
      // regel hebben gezet; die blijven gewoon in hun regel staan).
      answerEl.normalize();
      const regels = [[]];
      for (const n of Array.from(answerEl.childNodes)) {
        if (n.nodeType === 3) {
          n.nodeValue.split('\n').forEach((d, i) => { if (i > 0) regels.push([]); if (d) regels[regels.length - 1].push(document.createTextNode(d)); });
        } else regels[regels.length - 1].push(n);
      }
      const soort = (r) => {
        const f = r[0];
        if (!f) return { t: 'leeg' };
        if (f.nodeType === 3) {
          let m = f.nodeValue.match(/^\s*[•*-]\s+/);
          if (m) { f.nodeValue = f.nodeValue.slice(m[0].length); return { t: 'punt' }; }
          m = f.nodeValue.match(/^\s*(\d{1,2})[.)]\s+/);
          if (m) { f.nodeValue = f.nodeValue.slice(m[0].length); return { t: 'stap', n: m[1] }; }
          if (r.length === 1 && !f.nodeValue.trim()) return { t: 'leeg' };
        }
        return { t: 'tekst' };
      };
      const frag = document.createDocumentFragment();
      let lijst = null, lijstSoort = '', naWit = false;
      for (const r of regels) {
        const k = soort(r);
        if (k.t === 'leeg') { lijst = null; naWit = frag.childNodes.length > 0; continue; }
        if (k.t === 'tekst') {
          lijst = null;
          const el = document.createElement('span');
          el.className = 'regel' + (naWit ? ' na-wit' : '');
          r.forEach((n) => el.appendChild(n));
          frag.appendChild(el);
        } else {
          if (!lijst || lijstSoort !== k.t) {
            lijst = document.createElement(k.t === 'punt' ? 'ul' : 'ol');
            lijst.className = (k.t === 'punt' ? 'punten' : 'stappen') + (naWit ? ' na-wit' : '');
            lijstSoort = k.t;
            frag.appendChild(lijst);
          }
          const li = document.createElement('li');
          if (k.n) li.dataset.n = k.n;
          r.forEach((n) => li.appendChild(n));
          lijst.appendChild(li);
        }
        naWit = false;
      }
      answerEl.textContent = '';
      answerEl.appendChild(frag);
    }

    function linkifyProducts(answerEl) {
      let textNode = null;
      answerEl.childNodes.forEach(n => { if (n.nodeType === 3 && !textNode) textNode = n; });
      if (!textNode) return;
      const text = textNode.nodeValue;
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // VERPLICHTE merk/kwalificatie-prefix: alleen een echte productvermelding
      // ("EAZYFIX® Premium Houtrotvuller", "EAZYFIX® Houtversterker", "Premium
      // Houtplamuur") wordt een link, en de hele naam inclusief EAZYFIX is de chip.
      // Zo wordt een los woord als "frees" of "houtvochtmeter" geen rare chip.
      const prefix = '(?:EAZYFIX[\\s®]*(?:Premium\\s*)?|Premium\\s+)';
      const alternation = PRODUCTS.map(p => '(?:' + p.re.source + ')').join('|');
      // Producten vragen de merk/kwalificatie-prefix; gereedschap (TOOLS) mag kaal.
      const toolAlt = TOOLS.map(t => '(?:' + t.re.source + ')').join('|');
      const combined = new RegExp('(?:' + prefix + '(?:' + alternation + '))|(?:' + toolAlt + ')', 'gi');
      let html = '', last = 0, m;
      while ((m = combined.exec(text)) !== null) {
        if (m.index === combined.lastIndex) { combined.lastIndex++; continue; }
        const hit = m[0];
        html += esc(text.slice(last, m.index));
        const prod = PRODUCTS.find(p => p.re.test(hit)) || TOOLS.find(t => t.re.test(hit));
        if (prod) {
          html += '<a class="product-link" href="' + SITE + prod.path + '" target="_blank" rel="noopener">' + esc(hit) + '</a>';
        } else {
          html += esc(hit);
        }
        last = m.index + hit.length;
      }
      html += esc(text.slice(last));
      const holder = document.createElement('span');
      holder.innerHTML = html;
      while (holder.firstChild) answerEl.insertBefore(holder.firstChild, textNode);
      answerEl.removeChild(textNode);
    }

    // Maak vermeldingen van onze eigen site (eazy-fix.de en eazy-fix.nl/de) klikbaar. UITSLUITEND
    // ons eigen domein; verkooppunt- of andere externe domeinen laten we met rust.
    // Draait NA linkifyProducts en loopt alle tekst-nodes af, behalve wat al in
    // een <a> zit. Trailing leestekens (punt/komma) blijven buiten de link.
    const SITE_RE = /\b((?:https?:\/\/)?(?:www\.)?eazy-fix\.(?:de|nl\/de)(?:\/[^\s<)]*)?)/gi;
    function linkifySite(answerEl) {
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const walker = document.createTreeWalker(answerEl, NodeFilter.SHOW_TEXT, null);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentNode && node.parentNode.closest && node.parentNode.closest('a')) continue;
        SITE_RE.lastIndex = 0;
        if (SITE_RE.test(node.nodeValue)) targets.push(node);
      }
      targets.forEach(tn => {
        const text = tn.nodeValue;
        let html = '', last = 0, m;
        SITE_RE.lastIndex = 0;
        while ((m = SITE_RE.exec(text)) !== null) {
          let hit = m[1], trail = '';
          const tm = hit.match(/[.,;:!?)]+$/);
          if (tm) { trail = tm[0]; hit = hit.slice(0, -trail.length); }
          const href = /^https?:\/\//i.test(hit) ? hit : 'https://' + hit;
          html += esc(text.slice(last, m.index));
          html += '<a class="site-link" href="' + href + '" target="_blank" rel="noopener">' + esc(hit) + '</a>' + esc(trail);
          last = m.index + m[1].length;
        }
        html += esc(text.slice(last));
        const holder = document.createElement('span');
        holder.innerHTML = html;
        const parent = tn.parentNode;
        while (holder.firstChild) parent.insertBefore(holder.firstChild, tn);
        parent.removeChild(tn);
      });
    }

    // Maak telefoonnummers klikbaar (tel:). Ondersteunt +31 (0)... en nationale
    // 0-nummers met spaties/streepjes. Maatvoering (2:1, 18%, 30.000, postcodes)
    // matcht bewust NIET. Draait op tekst-nodes buiten bestaande links.
    // Ook Duitse vormen: +49 / 0049 en een schuine streep als scheiding (03222 / 1097923).
    const PHONE_RE = /((?:\+31|\+49|0049)[\d\s()\/-]{8,16}\d)|(\b0\d{1,4}(?:\s?\/\s?|[\s-])?\d{2,4}[\s-]?\d{2,4}(?:[\s-]?\d{1,4})?)/g;
    function telHref(s) { return 'tel:' + s.replace(/[()\s\/-]/g, '').replace(/^0049/, '+49').replace(/^\+(31|49)0/, '+$1'); }
    function linkifyPhones(answerEl) {
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const walker = document.createTreeWalker(answerEl, NodeFilter.SHOW_TEXT, null);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentNode && node.parentNode.closest && node.parentNode.closest('a')) continue;
        PHONE_RE.lastIndex = 0;
        if (PHONE_RE.test(node.nodeValue)) targets.push(node);
      }
      targets.forEach(tn => {
        const text = tn.nodeValue;
        let html = '', last = 0, m;
        PHONE_RE.lastIndex = 0;
        while ((m = PHONE_RE.exec(text)) !== null) {
          let hit = m[0], trail = '';
          const tm = hit.match(/[.,;:!?)]+$/);
          if (tm) { trail = tm[0]; hit = hit.slice(0, -trail.length); }
          html += esc(text.slice(last, m.index));
          html += '<a class="site-link" href="' + telHref(hit) + '">' + esc(hit) + '</a>' + esc(trail);
          last = m.index + m[0].length;
        }
        html += esc(text.slice(last));
        const holder = document.createElement('span');
        holder.innerHTML = html;
        const parent = tn.parentNode;
        while (holder.firstChild) parent.insertBefore(holder.firstChild, tn);
        parent.removeChild(tn);
      });
    }

    const EMAIL_RE = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g;
    // Maakt e-mailadressen klikbaar als mailto-link.
    function linkifyEmails(answerEl) {
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const walker = document.createTreeWalker(answerEl, NodeFilter.SHOW_TEXT, null);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentNode && node.parentNode.closest && node.parentNode.closest('a')) continue;
        EMAIL_RE.lastIndex = 0;
        if (EMAIL_RE.test(node.nodeValue)) targets.push(node);
      }
      targets.forEach(tn => {
        const text = tn.nodeValue;
        let html = '', last = 0, m;
        EMAIL_RE.lastIndex = 0;
        while ((m = EMAIL_RE.exec(text)) !== null) {
          let hit = m[0], trail = '';
          const tm = hit.match(/[.,;:!?)]+$/);
          if (tm) { trail = tm[0]; hit = hit.slice(0, -trail.length); }
          html += esc(text.slice(last, m.index));
          html += '<a class="site-link" href="mailto:' + esc(hit) + '">' + esc(hit) + '</a>' + esc(trail);
          last = m.index + m[0].length;
        }
        html += esc(text.slice(last));
        const holder = document.createElement('span');
        holder.innerHTML = html;
        const parent = tn.parentNode;
        while (holder.firstChild) parent.insertBefore(holder.firstChild, tn);
        parent.removeChild(tn);
      });
    }

    // Toon klikbare videokaartje(s) met thumbnail onder een antwoord (YouTube).
    // Winkelkaartjes (verzoek Ralf 12-11-2026): de server stuurt de gevonden winkels mee
    // uit de winkellijst; de bot schrijft er dan alleen een korte inleiding bij.
    const ICOON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
    const ICOON_BEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
    const ICOON_ROUTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>';
    function renderWinkels(answerEl, winkels) {
      if (!Array.isArray(winkels) || !winkels.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'winkels';
      for (const w of winkels.slice(0, 5)) {
        if (!w || typeof w.naam !== 'string') continue;
        const kaart = document.createElement('div');
        kaart.className = 'winkel';
        const adres = [w.straat, w.plaats].filter(Boolean).join(', ');
        const zoek = [w.naam, w.straat, [w.postcode, w.plaats].filter(Boolean).join(' ')].filter(Boolean).join(', ');
        kaart.innerHTML = '<span class="wpin">' + ICOON_PIN + '</span><div class="wbody"><div class="wnaam"></div><div class="wadres"></div></div><span class="wkm"></span><div class="wknoppen"></div>';
        kaart.querySelector('.wnaam').textContent = w.naam;
        kaart.querySelector('.wadres').textContent = adres;
        const km = kaart.querySelector('.wkm');
        if (typeof w.km === 'number') { km.textContent = (w.km < 10 ? w.km.toFixed(1) : String(Math.round(w.km))).replace('.', T.decimaal) + ' km'; km.title = T.hemelsbreed; }
        else km.remove();
        const knoppen = kaart.querySelector('.wknoppen');
        const tel = typeof w.telefoon === 'string' ? w.telefoon.replace(/[^\d+]/g, '') : '';
        if (tel) {
          const a = document.createElement('a');
          a.className = 'wknop'; a.href = 'tel:' + tel;
          a.innerHTML = ICOON_BEL + '<span></span>'; a.querySelector('span').textContent = T.bellen;
          a.setAttribute('aria-label', T.bellen + ' ' + w.naam);
          knoppen.appendChild(a);
        }
        const r = document.createElement('a');
        r.className = 'wknop'; r.target = '_blank'; r.rel = 'noopener';
        r.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(zoek);
        r.innerHTML = ICOON_ROUTE + '<span></span>'; r.querySelector('span').textContent = T.route;
        r.setAttribute('aria-label', T.route + ' ' + w.naam);
        knoppen.appendChild(r);
        wrap.appendChild(kaart);
      }
      if (!wrap.childNodes.length) return;
      (answerEl.closest('.row') || answerEl).after(wrap);
      scrollLog();
    }

    function renderVideos(answerEl, videos) {
      if (!videos || !videos.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'videos';
      for (const v of videos) {
        const a = document.createElement('a');
        a.className = 'video';
        a.href = v.url; a.target = '_blank'; a.rel = 'noopener';
        a.innerHTML = '<span class="vthumb"><img class="vthumbimg" alt="" />'
          + '<span class="vplay">▶</span></span>'
          + '<span class="vbody"><span class="vtxt"></span><span class="vcta">' + T.bekijkVideo + '</span></span>';
        a.querySelector('.vtxt').textContent = v.title;
        const img = a.querySelector('.vthumbimg');
        const thumbEl = a.querySelector('.vthumb');
        if (v.thumb) {
          img.onerror = () => { img.remove(); thumbEl.classList.add('vthumb-fallback'); };
          img.src = v.thumb;
        } else {
          img.remove(); thumbEl.classList.add('vthumb-fallback');
        }
        wrap.appendChild(a);
      }
      (answerEl.closest('.row') || answerEl).after(wrap);
      scrollLog();
    }

    // Duimpjes per antwoord: tijdelijk terug zolang het team test (28-10-2026, verzoek
    // Nina). Na de testfase op false zetten; de smiley-beoordeling blijft dan over.
    const DUIMPJES_TESTFASE = false; // testweek voorbij (3-11-2026, Ralf): alleen de smileys
    // Iconen van de feedback-rij, in de lijnstijl van de fotoknop in de composer:
    // currentColor, 1.8 stroke, ronde uiteinden. currentColor zorgt dat een knop
    // in de navy selectie-stand (.sel) zijn icoon vanzelf wit meekleurt.
    const svgIcon = (paths) =>
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"'
      + ' stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
    const ICON_UP   = svgIcon('<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>');
    const ICON_DOWN = svgIcon('<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>');
    function addFeedbackRow(question, answerEl) {
      const answer = answerEl.textContent;
      const row = document.createElement('div');
      row.className = 'fb';
      row.innerHTML =
        '<button class="fbup" title="Goed" aria-label="Goed">' + ICON_UP + '</button>' +
        '<button class="fbdown" title="Kon beter" aria-label="Kon beter">' + ICON_DOWN + '</button>' +
        '<input class="fbc" placeholder="Wat kon beter? (optioneel)" />' +
        '<button class="fbsend">Verstuur</button>' +
        '<span class="fbmsg"></span>';

      anchor.after(row);
      scrollLog();
      let rating = null;

      down.onclick = () => { rating = 'down'; down.classList.add('sel'); up.classList.remove('sel'); };
      row.querySelector('.fbsend').onclick = async () => {
