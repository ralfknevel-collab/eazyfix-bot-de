    // Gesprek beëindigen en beoordelen (21-10-2026). De duimpjes per antwoord waren
    // voor interne testers; bezoekers geven één oordeel over het hele gesprek: knop
    // "Gesprek beëindigen" (zichtbaar na het eerste antwoord), drie smileys, bij
    // neutraal of ontevreden een optionele opmerking, daarna "Nieuw gesprek".
    const chatEl = document.querySelector('.chat');
    const eindBtn = document.getElementById('eind');
    function toonEindknop() { chatEl.classList.add('beantwoord'); }
    const smiley = (mond) =>
      '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.1" fill="currentColor" stroke="none"/>'
      + mond + '</svg>';
    const SMILEYS = [
      { oordeel: 'blij', label: T.goed, svg: smiley('<path d="M8 14.5c1 1.4 2.4 2 4 2s3-.6 4-2"/>') },
      { oordeel: 'neutraal', label: T.gingWel, svg: smiley('<path d="M8.5 15.5h7"/>') },
      { oordeel: 'ontevreden', label: T.nietGoed, svg: smiley('<path d="M8 16.5c1-1.4 2.4-2 4-2s3 .6 4 2"/>') },
    ];
    const ICOON_DANK = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>';

    // Lichte vraag na stilte (besluit Ralf 14-11-2026): bijna niemand klikte zelf op "Gesprek
    // afronden", dus kwam er weinig oordeel binnen. Na een volledig antwoord loopt een timer
    // van 10 seconden; gebeurt er niets (geen typen, geen foto, geen knopje), dan verschijnt
    // onder het laatste antwoord één regeltje "Heb je hier wat aan?" met drie kleine smileys.
    // Het gesprek gaat niet dicht. Eén keer per gesprek; de server neemt ook maar één
    // oordeel per gesprek aan (409).
    // Keuzes: (1) verborgen tabblad: de timer stopt en begint bij terugkomst opnieuw met 10
    // seconden, zodat de klant eerst weer kan lezen. (2) Herladen: de vlaggen staan los in
    // sessionStorage onder PEIL_OPSLAG, gekoppeld aan de gesprekscode; een teruggezet gesprek
    // toont het regeltje dus niet opnieuw als het al getoond was. (3) Doortypen terwijl het
    // regeltje open staat: het blijft staan onder het antwoord waar het bij hoort, zonder
    // verspringen; pas "Gesprek afronden" haalt een onbeantwoord regeltje weg.
    const PEIL_WACHT = 10000;
    const PEIL_OPSLAG = 'eazyfix-de-peil';
    let peilTimer = null;
    let peilKan = false;     // er staat een volledig antwoord als laatste beurt
    let peilGetoond = false; // regeltje al eens getoond in dit gesprek
    let beoordeeld = false;  // al een oordeel gegeven (via regeltje of kaart)
    function bewaarPeil() {
      try { sessionStorage.setItem(PEIL_OPSLAG, JSON.stringify({ c: conversationId, getoond: peilGetoond, beoordeeld })); } catch {}
    }
    function leesPeil() {
      try {
        const p = JSON.parse(sessionStorage.getItem(PEIL_OPSLAG) || 'null');
        if (p && p.c === conversationId) { peilGetoond = p.getoond === true; beoordeeld = p.beoordeeld === true; }
      } catch {}
    }
    function wisPeil() {
      try { sessionStorage.removeItem(PEIL_OPSLAG); } catch {}
    }
    function stopPeil() { clearTimeout(peilTimer); peilTimer = null; }
    function startPeil() {
      stopPeil();
      if (!peilKan || peilGetoond || beoordeeld || chatEl.classList.contains('beeindigd')) return;
      if (document.visibilityState !== 'visible') return;
      peilTimer = setTimeout(toonPeil, PEIL_WACHT);
    }
    // Na een volledig antwoord: timer aan. Bij elke nieuwe beurt: uit.
    function peilNaAntwoord() { peilKan = true; startPeil(); }
    function peilNieuweBeurt() { peilKan = false; stopPeil(); }
    function magPeil() {
      return peilKan && !peilGetoond && !beoordeeld && !chatEl.classList.contains('beeindigd')
        && !sendBtn.disabled && !inEl.value.trim() && !pendingPhotos.length
        && !log.querySelector('.gegevens form') && document.visibilityState === 'visible';
    }
    function toonPeil() {
      peilTimer = null;
      if (!magPeil()) return;
      peilGetoond = true;
      bewaarPeil();
      const onderaan = maxScroll() - log.scrollTop < 60;
      const rij = document.createElement('div');
      rij.className = 'peil';
      rij.setAttribute('role', 'group');
      rij.setAttribute('aria-label', T.peilVraag);
      rij.innerHTML = '<span class="peilvraag" aria-hidden="true"></span><span class="smileys">'
        + SMILEYS.map((s) => '<button type="button" data-oordeel="' + s.oordeel + '" aria-label="' + s.label + '" title="' + s.label + '"><span class="gezicht">' + s.svg + '</span></button>').join('')
        + '</span><div class="toelichting"><textarea rows="2" maxlength="1000"></textarea><button type="button" class="verstuur"></button></div><div class="fout" role="alert"></div>';
      rij.querySelector('.peilvraag').textContent = T.peilVraag;
      const tekstveld = rij.querySelector('textarea');
      tekstveld.placeholder = T.watBeter; tekstveld.setAttribute('aria-label', T.watBeter);
      rij.querySelector('.verstuur').textContent = T.verstuur;
      log.appendChild(rij);
      // Alleen meeschuiven als de klant al onderaan stond; anders verschijnt "Lees verder".
      if (onderaan) log.scrollTop = maxScroll();
      toonLeesVerder();
      reportHeight();
      leesVoor(T.peilVoorlees); // aankondigen, de focus blijft waar hij was
      postToSite({ type: 'event', name: 'rating_prompt_shown' });

      let keuze = null;
      const knoppen = rij.querySelectorAll('.smileys button');
      const toelichting = rij.querySelector('.toelichting');
      const fout = rij.querySelector('.fout');
      knoppen.forEach((b) => {
        b.onclick = () => {
          keuze = b.dataset.oordeel;
          knoppen.forEach((k) => k.classList.toggle('sel', k === b));
          rij.querySelector('.smileys').classList.add('gekozen');
          if (keuze === 'blij') { toelichting.classList.remove('aan'); verstuur(); return; }
          toelichting.classList.add('aan');
          tekstveld.focus({ preventScroll: true });
          // Veld en knop helemaal in beeld: het gesprek zelf zoveel omhoog schuiven als nodig
          // (scrollIntoView stopte halverwege doordat de focus hem onderbrak).
          const teLaag = rij.getBoundingClientRect().bottom - log.getBoundingClientRect().bottom + 12;
          if (teLaag > 0) log.scrollTo({ top: log.scrollTop + teLaag, behavior: MINDER_BEWEGING ? 'auto' : 'smooth' });
        };
      });
      rij.querySelector('.verstuur').onclick = verstuur;
      async function verstuur() {
        if (!keuze || beoordeeld) return;
        rij.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        fout.textContent = '';
        try {
          const resp = await apiFetch('/api/feedback/gesprek', {
            method: 'POST',
            body: JSON.stringify({ conversationId, rating: keuze, comment: keuze === 'blij' ? '' : tekstveld.value }),
          });
          if (!resp.ok && resp.status !== 409) throw new Error('status ' + resp.status);
          beoordeeld = true;
          bewaarPeil();
          postToSite({ type: 'event', name: 'rating_given' });
          const hadFocus = rij.contains(document.activeElement);
          rij.classList.add('klaar');
          rij.innerHTML = '<span class="dank" tabindex="-1">' + ICOON_DANK + '<span></span></span>';
          rij.querySelector('.dank span').textContent = T.peilDank;
          leesVoor(T.peilDank);
          // Focus niet kwijtraken, maar ook niet naar het invoerveld (dat opent op een telefoon het toetsenbord).
          if (hadFocus) rij.querySelector('.dank').focus({ preventScroll: true });
        } catch (e) {
          rij.querySelectorAll('button').forEach((b) => { b.disabled = false; });
          fout.textContent = T.opslaanFout;
        }
        reportHeight();
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') startPeil(); else stopPeil();
    });

    function eindigGesprek() {
      if (chatEl.classList.contains('beeindigd') || sendBtn.disabled) return;
      chatEl.classList.add('beeindigd');
      photoMenu.hidden = true;
      stopPeil();
      wisGesprek(); // afgerond gesprek niet terugzetten na een paginawissel
      wegKeuzes(); // keuzeknopjes horen niet meer bij een afgerond gesprek
      log.querySelectorAll('.peil:not(.klaar)').forEach((el) => el.remove()); // geen twee vragen tegelijk
      const card = document.createElement('div');
      card.className = 'beoordeling';
      // Al beoordeeld via het lichte regeltje: geen tweede smileykaart (de server neemt maar
      // één oordeel per gesprek aan), meteen de afsluiting met "Nieuw gesprek".
      if (beoordeeld) {
        card.innerHTML = '<div class="dank">' + ICOON_DANK + T.dank + '</div><button type="button" class="nieuw">' + T.nieuw + '</button>';
        log.appendChild(card);
        scrollLog();
        const nieuw = card.querySelector('.nieuw');
        nieuw.onclick = nieuwGesprek;
        nieuw.focus({ preventScroll: true });
        postToSite({ type: 'event', name: 'chat_ended' });
        return;
      }
      card.innerHTML =
        '<div class="vraag">' + T.hoeWas + '</div>'
        + '<div class="sub">' + T.helpt + '</div>'
        + '<div class="smileys">'
        + SMILEYS.map((s) => '<button type="button" data-oordeel="' + s.oordeel + '"><span class="gezicht">' + s.svg + '</span><span class="lbl">' + s.label + '</span></button>').join('')
        + '</div>'
        + '<div class="toelichting"><textarea rows="2" maxlength="1000" placeholder="' + T.watBeter + '" aria-label="' + T.watBeter + '"></textarea><button type="button" class="verstuur">' + T.verstuur + '</button></div>'
        + '<div class="fout"></div>';
      log.appendChild(card);
      scrollLog();
      card.querySelector('.smileys button').focus({ preventScroll: true }); // invoerveld is weg; focus niet kwijtraken
      postToSite({ type: 'event', name: 'chat_ended' });

      let keuze = null;
      const toelichting = card.querySelector('.toelichting');
      const tekstveld = card.querySelector('textarea');
      const fout = card.querySelector('.fout');
      const knoppen = card.querySelectorAll('.smileys button');
      knoppen.forEach((b) => {
        b.onclick = () => {
          keuze = b.dataset.oordeel;
          knoppen.forEach((k) => k.classList.toggle('sel', k === b));
          card.querySelector('.smileys').classList.add('gekozen');
          if (keuze === 'blij') { toelichting.classList.remove('aan'); verstuur(); return; }
          toelichting.classList.add('aan');
          scrollLog();
          tekstveld.focus();
        };
      });
      card.querySelector('.verstuur').onclick = verstuur;

      async function verstuur() {
        if (!keuze) return;
        card.querySelectorAll('button').forEach((b) => { b.disabled = true; });
        fout.textContent = '';
        try {
          const resp = await apiFetch('/api/feedback/gesprek', {
            method: 'POST',
            body: JSON.stringify({ conversationId, rating: keuze, comment: tekstveld.value }),
          });
          if (!resp.ok && resp.status !== 409) throw new Error('status ' + resp.status);
          beoordeeld = true;
          postToSite({ type: 'event', name: 'rating_given' });
          card.innerHTML = '<div class="dank"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>' + T.dank + '</div><button type="button" class="nieuw">' + T.nieuw + '</button>';
        } catch (e) {
          card.querySelectorAll('button').forEach((b) => { b.disabled = false; });
          fout.textContent = T.beoordelingFout;
          if (!card.querySelector('.nieuw')) card.insertAdjacentHTML('beforeend', '<button type="button" class="nieuw">' + T.nieuw + '</button>');
        }
        const nieuw = card.querySelector('.nieuw');
        if (nieuw) nieuw.onclick = nieuwGesprek;
        scrollLog();
      }
    }
    eindBtn.addEventListener('click', eindigGesprek);

    function nieuwGesprek() {
      history.splice(0, history.length);
      extras = {};
      wisGesprek();
      peilNieuweBeurt(); peilGetoond = false; beoordeeld = false; wisPeil();
      conversationId = 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      clearPreview();
      log.innerHTML = '';
      volg = null;
      chatEl.classList.remove('beeindigd', 'beantwoord');
      toonOpening();
      toonLeesVerder();
      postToSite({ type: 'event', name: 'new_chat' });
    }

    // Gesprek bewaren per tabblad (review design punt 12): wie naar een andere pagina van de
    // site gaat of vernieuwt, ziet het gesprek terug. sessionStorage kan in een iframe van een
    // andere site geblokkeerd zijn; dan wordt er gewoon niets bewaard. Foto's zelf gaan er
    // niet in (te groot); bij terugzetten staat er een plaatsaanduiding.
    // extras: per plek in history wat niet in de tekst staat (foto, video's, winkels, keuzes).
    const OPSLAG = 'eazyfix-de-gesprek';
    let extras = {};
    function bewaarGesprek() {
      try { sessionStorage.setItem(OPSLAG, JSON.stringify({ v: 1, conversationId, history, extras })); } catch {}
    }
    function wisGesprek() {
      try { sessionStorage.removeItem(OPSLAG); } catch {}
    }
    function leesGesprek() {
      try {
        const g = JSON.parse(sessionStorage.getItem(OPSLAG) || 'null');
        if (!g || g.v !== 1 || typeof g.conversationId !== 'string' || !Array.isArray(g.history) || !g.history.length) return null;
        if (!g.history.every((m) => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')) return null;
        return { conversationId: g.conversationId, history: g.history, extras: g.extras && typeof g.extras === 'object' ? g.extras : {} };
      } catch { return null; }
    }
    function fotoPlekBubbel(aantal, bijschrift, tijd) {
      const d = bubble('user', '', tijd);
      d.classList.add('has-photo');
      const plek = document.createElement('span');
      plek.className = 'fotoplek';
      plek.textContent = '📷 ' + (aantal > 1 ? aantal + ' × ' : '') + T.fotoPlek;
      d.appendChild(plek);
      if (bijschrift) {
        const c = document.createElement('div');
        c.className = 'photo-caption';
        c.textContent = bijschrift;
        d.appendChild(c);
      }
      return d;
    }
    function herstelGesprek(g) {
      conversationId = g.conversationId;
      history.push(...g.history);
      extras = g.extras;
      const rij = document.createElement('div');
      rij.className = 'nieuwrij';
      const link = document.createElement('button');
      link.type = 'button'; link.className = 'nieuwlink'; link.textContent = T.nieuw;
      link.addEventListener('click', () => { if (!sendBtn.disabled) nieuwGesprek(); });
      rij.appendChild(link);
      log.appendChild(rij);
      g.history.forEach((m, i) => {
        const x = extras[i] || {};
        const tijd = typeof x.t === 'string' ? x.t : '';
        if (m.role === 'user') {
          if (x.foto) fotoPlekBubbel(x.foto, x.bijschrift || '', tijd);
          else bubble('user', m.content, tijd);
          return;
        }
        const out = bubble('bot', '', tijd);
        out.textContent = m.content;
        opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
        renderVideos(out, x.videos);
        renderWinkels(out, x.winkels);
        if (i === g.history.length - 1) renderKeuzes(out, Array.isArray(x.keuzes) ? x.keuzes : []);
      });
      if (history.some((m) => m.role === 'assistant')) toonEindknop();
      log.scrollTop = log.scrollHeight;
      toonLeesVerder();
      // Lichte vraag: al getoond of al beoordeeld in dit gesprek? Dan niet opnieuw.
      leesPeil();
      if (history[history.length - 1].role === 'assistant') peilNaAntwoord();
    }
    // Bij elke beurt die in history komt: tijd en extra's vastleggen, daarna bewaren.
    function legVast(i, x) { extras[i] = Object.assign({ t: nuTijd() }, extras[i] || {}, x || {}); }

    // Eén beurt tegelijk: knop uit tijdens het versturen (ook bij "Opnieuw proberen").
    async function beurt(fn) {
      if (sendBtn.disabled) return;
      wegKeuzes();
      peilNieuweBeurt();
      sendBtn.disabled = true;
      try { await fn(); } finally { sendBtn.disabled = false; }
    }

    // Foutmelding (review design punt 7): rustige rode bubbel met icoon, een knop "Opnieuw
    // proberen" waar dat zin heeft en een telefoonnummer als belknop in plaats van in de zin.
    const ICOON_FOUT = '<svg class="ficoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>';
    const ICOON_OPNIEUW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';
    // Geen "Opnieuw proberen" bij een daglimiet of een ongeldig bericht: dat lost opnieuw sturen niet op.
    function magOpnieuw(status, m) {
      return status !== 400 && status !== 413 && !/vandaag|today|heute|morgen|tomorrow/i.test(String(m || ''));
    }
    function foutKnoppen(na, opnieuw, tel) {
      const acties = document.createElement('div');
      acties.className = 'foutacties';
      if (opnieuw) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'foutknop';
        b.innerHTML = ICOON_OPNIEUW + '<span></span>';
        b.querySelector('span').textContent = T.opnieuw;
        b.addEventListener('click', () => { if (!sendBtn.disabled) opnieuw(); });
        acties.appendChild(b);
      }
      if (tel) {
        const a = document.createElement('a');
        a.className = 'foutknop'; a.href = telHref(tel);
        a.innerHTML = ICOON_BEL + '<span></span>';
        a.querySelector('span').textContent = T.belKlantenservice;
        acties.appendChild(a);
      }
      if (acties.childNodes.length) na.after(acties);
      return acties;
    }
    function toonFout(out, tekst, opnieuw) {
      const row = out.closest('.row');
      row.className = 'row row-bot err';
      out.innerHTML = ICOON_FOUT + '<span class="ftekst"></span>';
      out.querySelector('.ftekst').textContent = tekst;
      PHONE_RE.lastIndex = 0;
      const tel = PHONE_RE.exec(tekst);
      foutKnoppen(row, opnieuw, tel ? tel[0].replace(/[.,;:!?)]+$/, '') : '');
      leesVoor(tekst);
      scrollLog();
    }
    // Afgebroken antwoord: de tekst tot zover blijft staan, met een knop om de vraag opnieuw te stellen.
    function haperKnop(out, opnieuw) {
      foutKnoppen(out.closest('.row'), () => {
        if (history.length && history[history.length - 1].role === 'assistant') history.pop();
        if (history.length && history[history.length - 1].role === 'user') history.pop();
        bewaarGesprek();
        out.closest('.bubble-wrap').remove();
        opnieuw();
      }, '');
    }
    // Wachten op een opzoeking (punt 8): de puntjes blijven staan, met een korte uitleg ernaast.
    function toonWachten(out, tekst) {
      if (!out.querySelector('.wachten')) out.innerHTML = '<span class="wachten"><span class="typing" aria-hidden="true"><span></span><span></span><span></span></span><span class="wachttekst"></span></span>';
      out.querySelector('.wachttekst').textContent = tekst;
      scrollLog();
    }
    function laatsteVraag() { const w = log.querySelectorAll('.w-user'); return w.length ? w[w.length - 1] : null; }

    async function sendText(text, opnieuw) {
      history.push({ role: 'user', content: text });
      const vraagEl = opnieuw ? laatsteVraag() : bubble('user', text);
      if (!opnieuw) postToSite({ type: 'event', name: 'message_sent' });
      const out = bubble('bot', '…');
      startVolgen(vraagEl, out);
      const nogEens = () => beurt(() => sendText(text, true));
      let acc = '', streamFout = '';
      const wachtTimer = setTimeout(() => { if (!acc && out.isConnected && !out.closest('.err')) toonWachten(out, T.duurtLanger); }, 12000);
      try {
        await vraagLocatieBijWeervraag(text);
        const resp = await apiFetch('/api/chat/stream', {
          method: 'POST',
          body: JSON.stringify({ messages: history, conversationId, geo, context: CONTEXT, kaarten: true, keuzes: true }),
        });
        if (!resp.ok) {
          let m = T.misgegaan;
          try { const j = await resp.json(); if (j && j.error) m = vf(j.error); } catch {}
          history.pop(); // mislukte user-beurt niet in de geschiedenis houden
          // Te lang of ongeldig: de vraag terug in het invoerveld, zodat de klant hem kan inkorten.
          if (resp.status === 400 && !inEl.value) { inEl.value = text; inEl.dispatchEvent(new Event('input')); }
          toonFout(out, m, magOpnieuw(resp.status, m) ? nogEens : null);
          return;
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '', videos = null, winkels = null;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') continue;
            try {
              const obj = JSON.parse(payload);
              if (obj.reset) { acc = ''; out.textContent = ''; }
              if (obj.status === 'tool' && !acc) { toonWachten(out, T.zoekOp); }
              if (obj.text) { acc += obj.text; out.textContent = stripFotoMarker(acc); }
              if (obj.videos) { videos = obj.videos; }
              if (obj.winkels) { winkels = obj.winkels; }
              if (obj.error) { streamFout = vf(obj.error); }
            } catch {}
          }
          scrollLog();
        }
        if (streamFout && !acc) { history.pop(); toonFout(out, streamFout, magOpnieuw(0, streamFout) ? nogEens : null); return; }
        if (!acc) { history.pop(); toonFout(out, T.misgegaan, nogEens); return; }
        if (acc) { history.push({ role: 'assistant', content: stripFotoMarker(acc) }); toonEindknop(); if (DUIMPJES_TESTFASE) addFeedbackRow(text, out); opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out); renderVideos(out, videos); renderWinkels(out, winkels); renderKeuzes(out, haalKeuzes(acc)); postToSite({ type: 'event', name: 'answer_received' }); }
        legVast(history.length - 2); legVast(history.length - 1, { videos: videos || undefined, winkels: winkels || undefined, keuzes: haalKeuzes(acc) });
        bewaarGesprek();
        leesVoor(out.textContent);
        peilNaAntwoord();
      } catch (e) {
        // Viel de verbinding weg terwijl het antwoord al binnenkwam (bv. telefoon even
        // op slot of naar een andere app), laat het antwoord tot zover dan staan in
        // plaats van het te vervangen door een rode foutmelding (test Ralf, 4-11-2026).
        if (acc) {
          const deel = stripFotoMarker(acc);
          out.textContent = deel + T.haperde;
          if (history[history.length - 1].role !== 'assistant') history.push({ role: 'assistant', content: deel });
          toonEindknop(); opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          legVast(history.length - 2); legVast(history.length - 1);
          bewaarGesprek();
          haperKnop(out, nogEens);
          leesVoor(out.textContent);
          return;
        }
        history.pop(); // mislukte user-beurt niet in de geschiedenis houden
        toonFout(out, T.geenVerbinding, nogEens);
      } finally {
        clearTimeout(wachtTimer);
        stopVolgen();
      }
    }

    // Toon de verzonden foto zelf in een user-bubbel (rij 8: afbeelding zichtbaar).
    // Optioneel bijschrift (foto + vraag in één beurt) eronder tonen.
    function userPhotoBubble(files, caption) {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap w-user';
      const row = document.createElement('div');
      row.className = 'row row-user user';
      const d = document.createElement('div');
      d.className = files.length > 1 ? 'msg has-photo multi' : 'msg has-photo';
      for (const file of files) {
        const img = document.createElement('img');
        img.className = 'photo';
        img.alt = T.fotoAlt;
        img.src = URL.createObjectURL(file);
        // M1 (review design 13-11-2026): pas na het laden weet de chat hoe hoog de foto is;
        // dan opnieuw schuiven, anders valt de voortgang onder de rand.
        img.onload = () => { URL.revokeObjectURL(img.src); scrollLog(); };
        d.appendChild(img);
      }
      if (caption) {
        const c = document.createElement('div');
        c.className = 'photo-caption';
        c.textContent = caption;
        d.appendChild(c);
      }
      row.appendChild(d);
      wrap.appendChild(row);
      // Ook een foto-bericht van de gebruiker krijgt de tijd eronder.
      const meta = document.createElement('div');
      meta.className = 'msg-meta msg-meta-user';
      meta.textContent = nuTijd();
      wrap.appendChild(meta);
      log.appendChild(wrap);
      scrollLog();
      return wrap;
    }

    function faseLabel(phase) {
      const labels = { foto: T.fFoto, schade: T.fSchade, kennisbank: T.fKennis, advies: T.fAdvies };
      return labels[phase] || '';
    }

    // Foto-analyse via de streaming-endpoint: toont een voortgangskaartje dat meeloopt met
    // de fase-events en laat daarna het advies binnenstromen. Valt bij stream-uitval
    // (vóór het eerste tekst-event) terug op de oude niet-streaming endpoint.
    async function sendPhoto(files, caption, opnieuw) {
      caption = (caption || '').trim();
      let vraagEl;
      if (!opnieuw) {
        vraagEl = userPhotoBubble(files, caption);
        postToSite({ type: 'event', name: 'photo_sent' });
      } else vraagEl = laatsteVraag();
      const out = bubble('bot', '…');
      const nogEens = () => beurt(() => sendPhoto(files, caption, true));

      // Voortgangskaartje (review design punt 2): verwachting, balk en de vier stappen.
      // Alle stappen staan er meteen; ze worden actief en klaar zodra het event binnenkomt.
      const orde = ['foto', 'schade', 'kennisbank', 'advies'];
      const kaart = document.createElement('div');
      kaart.className = 'fotokaart';
      kaart.setAttribute('role', 'status');
      kaart.innerHTML = '<div class="kop"></div><div class="duur"></div><div class="balk" aria-hidden="true"><span></span></div>';
      kaart.querySelector('.kop').textContent = T.fotoKop;
      kaart.querySelector('.duur').textContent = T.fotoDuur;
      const balk = kaart.querySelector('.balk span');
      const fasesEl = document.createElement('div');
      fasesEl.className = 'fases';
      kaart.appendChild(fasesEl);
      const stapEls = {};
      for (const p of orde) {
        const el = document.createElement('div');
        el.className = 'stap';
        el.innerHTML = '<span class="mark"><span class="open"></span></span><span class="lbl"></span>';
        el.querySelector('.lbl').textContent = faseLabel(p);
        fasesEl.appendChild(el);
        stapEls[p] = el;
      }
      out.innerHTML = '';
      out.appendChild(kaart);
      startVolgen(vraagEl, out);
      // Lijnstijl-SVG-vinkje in dezelfde stijl als de cameraknop (geen emoji). De
      // actieve stap toont de bestaande typing-dots.
      const checkSvg = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';
      const actiefMark = '<span class="typing" aria-hidden="true"><span></span><span></span><span></span></span>';
      function toonFase(phase) {
        const n = orde.indexOf(phase);
        if (n < 0) return;
        // Eerdere stappen klaar, deze actief; de balk schuift per stap een kwart op.
        orde.forEach((p, i) => {
          if (i < n) { stapEls[p].className = 'stap klaar'; stapEls[p].querySelector('.mark').innerHTML = checkSvg; }
        });
        stapEls[phase].className = 'stap actief';
        stapEls[phase].querySelector('.mark').innerHTML = actiefMark;
        balk.style.width = Math.min(92, (n + 1) * 25) + '%';
        scrollLog();
      }

      const images = [];
      for (const file of files) {
        const reduced = await downscaleImage(file);
        images.push(reduced || { base64: await fileToBase64(file), mimeType: file.type });
      }
      const fotoLabel = '[foto: ' + files.map((f) => f.name).join(', ') + ']';
      const histLabel = files.length > 1 ? '[' + files.length + " foto's van de schade verstuurd]" : '[foto van de schade verstuurd]';
      const fotoExtra = { foto: files.length, bijschrift: caption || undefined };

      let acc = '', gestreamd = false, klaarData = null;
      try {
        const resp = await apiFetch('/api/analyze-image/stream', {
          method: 'POST',
          body: JSON.stringify({ images, messages: history, conversationId, caption, context: CONTEXT, keuzes: true }),
        });
        if (!resp.ok) {
          // Limiet (429) of andere nette servermelding: toon de tekst van de server
          // als chatbubbel in plaats van terug te vallen op de niet-streaming route.
          let m = '';
          let j = null;
          try { j = await resp.json(); m = vf((j && j.error) || ''); } catch {}
          if (resp.status === 403 && j && j.leadRequired) { out.textContent = m; vraagGegevens(files, caption); return; }
          if (resp.status === 429 && m) { toonFout(out, m, magOpnieuw(429, m) ? nogEens : null); return; }
          throw new Error('stream ' + resp.status);
        }
        if (!resp.body) throw new Error('stream zonder body');
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue; // heartbeat (': ping') wordt zo genegeerd
            let obj; try { obj = JSON.parse(line.slice(6)); } catch { continue; }
            if (obj.phase) { toonFase(obj.phase); }
            if (obj.error) { throw new Error(vf(obj.error)); }
            if (obj.reset) { acc = ''; if (gestreamd) out.textContent = ''; }
            if (typeof obj.text === 'string') {
              if (!gestreamd) { gestreamd = true; out.innerHTML = ''; } // voortgang weg bij eerste tekst
              acc += obj.text;
              out.textContent = stripFotoMarker(acc);
              scrollLog();
            }
            if (obj.done) { klaarData = obj; }
          }
        }
        if (!gestreamd && !klaarData) throw new Error('stream leeg');

        if (klaarData) {
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          history.push({ role: 'user', content: caption ? histLabel + ' ' + caption : histLabel });
          history.push({ role: 'assistant', content: stripFotoMarker(acc) });
          toonEindknop();
          if (DUIMPJES_TESTFASE) addFeedbackRow(caption ? fotoLabel + ' ' + caption : fotoLabel, out);
          renderVideos(out, klaarData.videos);
          renderKeuzes(out, haalKeuzes(acc));
          postToSite({ type: 'event', name: 'answer_received' });
          legVast(history.length - 2, fotoExtra); legVast(history.length - 1, { videos: klaarData.videos || undefined, keuzes: haalKeuzes(acc) });
          peilNaAntwoord();
        } else {
          // Er kwam wel tekst binnen, maar nooit een {done}-event: mogelijk afgekapt.
          out.textContent = stripFotoMarker(acc) + T.haperde;
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          toonEindknop();
        }
        bewaarGesprek();
        leesVoor(out.textContent);
      } catch (e) {
        // Kwam er al tekst binnen, laat die staan met een korte notitie. Anders val
        // terug op de oude niet-streaming endpoint zodat de klusser altijd antwoord krijgt.
        if (gestreamd && acc) {
          out.textContent = stripFotoMarker(acc) + T.haperde;
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          toonEindknop();
          leesVoor(out.textContent);
          return;
        }
        try {
          const resp = await apiFetch('/api/analyze-image', {
            method: 'POST',
            body: JSON.stringify({ images, messages: history, conversationId, caption, context: CONTEXT, keuzes: true }),
          });
          const data = await resp.json();
          if (resp.status === 403 && data.leadRequired) { out.textContent = vf(data.error); vraagGegevens(files, caption); return; }
          if (!resp.ok) { const m = vf(data.error) || T.misgegaan; toonFout(out, m, magOpnieuw(resp.status, m) ? nogEens : null); return; }
          // Server levert al schone tekst; flow/productIds zijn techniek, NIET tonen.
          out.textContent = data.content;
          history.push({ role: 'user', content: caption ? histLabel + ' ' + caption : histLabel });
          history.push({ role: 'assistant', content: data.content });
          toonEindknop();
          if (DUIMPJES_TESTFASE) addFeedbackRow(caption ? fotoLabel + ' ' + caption : fotoLabel, out);
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          renderVideos(out, data.videos);
          renderKeuzes(out, haalKeuzes(data.content));
          legVast(history.length - 2, fotoExtra); legVast(history.length - 1, { videos: data.videos || undefined, keuzes: haalKeuzes(data.content) });
          bewaarGesprek();
          leesVoor(out.textContent);
          peilNaAntwoord();
        } catch (e2) {
          // Geen verbinding (fetch mislukt) of een onleesbaar antwoord: een gewone zin, geen
          // technische Engelse melding (M2, review design 13-11-2026).
          toonFout(out, e2 instanceof TypeError ? T.geenVerbinding : T.misgegaan, nogEens);
        }
      } finally {
        stopVolgen();
      }
    }

    // Gegevensformulier na de gratis foto's (wens van Nina, Eazyfix, 27-10-2026). De
    // server bepaalt wanneer (403 met leadRequired). Na het invullen gaat dezelfde foto
    // alsnog door de analyse. Mailchimp-koppeling volgt later via de server.
    function vraagGegevens(files, caption) {
      const card = document.createElement('div');
      card.className = 'beoordeling gegevens';
      card.innerHTML =
        '<form novalidate>'
        + '<label class="veld">' + T.naam + '*<input name="naam" autocomplete="name" maxlength="100" required></label>'
        + '<label class="veld">' + T.email + '*<input name="email" type="email" autocomplete="email" maxlength="200" required></label>'
        + '<label class="vink"><input type="checkbox" name="akkoord"><span>' + T.akkoord + '* <a href="' + SITE + '/datenschutzerklaerung/" target="_blank" rel="noopener">' + T.privacy + '</a></span></label>'
        + '<label class="vink"><input type="checkbox" name="nieuwsbrief"><span>' + T.nieuwsbrief + '</span></label>'
        + '<div class="verplicht">' + T.verplicht + '</div>'
        + '<div class="fout" role="alert"></div>'
        + '<button type="submit" class="verstuur">' + T.verderFoto + '</button>'
        + '</form>';
      log.appendChild(card);
      // Het formulier zelf bovenaan in beeld, niet de foto erboven (review design 13-11-2026).
      volg = null;
      log.scrollTop = Math.min(maxScroll(), Math.max(0, card.offsetTop - 12));
      toonLeesVerder();
      reportHeight();
      const form = card.querySelector('form');
      const fout = card.querySelector('.fout');
      form.naam.focus({ preventScroll: true });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        fout.textContent = '';
        const naam = form.naam.value.trim();
        const email = form.email.value.trim();
        if (!naam) { fout.textContent = T.vulNaam; form.naam.focus(); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { fout.textContent = T.vulEmail; form.email.focus(); return; }
        if (!form.akkoord.checked) { fout.textContent = T.geefAkkoord; return; }
        const knop = form.querySelector('.verstuur');
        knop.disabled = true;
        try {
          const resp = await apiFetch('/api/lead', {
            method: 'POST',
            body: JSON.stringify({ naam, email, akkoord: true, nieuwsbrief: form.nieuwsbrief.checked, conversationId }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.token) throw new Error(data.error || T.opslaanFout);
          leadToken = data.token;
          try { localStorage.setItem('eazyfix-lead', leadToken); } catch {}
          postToSite({ type: 'event', name: 'lead_given' });
          card.innerHTML = '<div class="dank"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg><span></span></div>';
          card.querySelector('.dank span').textContent = T.bedanktNaam(naam);
          scrollLog();
          sendBtn.disabled = true;
          try { await sendPhoto(files, caption, true); } finally { sendBtn.disabled = false; }
        } catch (err) {
          knop.disabled = false;
          fout.textContent = err.message;
        }
      });
    }

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sendBtn.disabled) return; // al een beurt bezig: geen tweede parallelle request
      wegKeuzes();
      peilNieuweBeurt();
      sendBtn.disabled = true;
      try {
        const text = inEl.value.trim();
        inEl.value = ''; inEl.style.height = 'auto'; toonTeller();
        if (pendingPhotos.length) {
          // Foto (met of zonder tekst): één beurt, één antwoord. Tekst gaat mee als
          // bijschrift, niet als losse tweede chat-request.
          const f = pendingPhotos; clearPreview();
          await sendPhoto(f, text);
        } else if (text) {
          await sendText(text);
        }
      } finally {
        sendBtn.disabled = false;
        // Staat het gegevensformulier open, dan blijft de focus daar (op het naamveld).
        if (!log.querySelector('.gegevens form')) inEl.focus(); else log.querySelector('.gegevens input[name=naam]').focus({ preventScroll: true });
      }
    });
    // Chat sluiten (verzoek JKC, 11-11-2026): de knop en de Escape-toets sturen {type:'close'}
    // naar de website. Escape komt bij de website niet aan zolang de cursor in de chat staat,
    // dus de chat geeft hem zelf door. Staat het fotomenu open, dan sluit Escape eerst dat.
    function sluitChat() { postToSite({ type: 'close' }); }
    document.getElementById('sluit').addEventListener('click', sluitChat);
    // Fullscreen (verzoek JKC, Rik 12-11-2026): de knop vraagt de website om {type:'expand'}
    // of {type:'collapse'}; de website stuurt na elke wijziging {source:'eazyfix-site',
    // type:'state', expanded, canExpand} terug. De chat volgt alleen die stand en luistert
    // alleen naar de eigen websites (en localhost bij lokaal testen).
    const SITE_ORIGINS = ['https://www.eazy-fix.nl', 'https://eazy-fix.nl', 'https://www.eazy-fix.de', 'https://eazy-fix.de', 'https://eazyfix.jkc-dev.nl'];
    const LOKAAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    const grootBtn = document.getElementById('groot');
    const ICOON_GROTER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
    const ICOON_KLEINER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
    let siteGroot = false;
    function toonGrootKnop() {
      const sleutel = siteGroot ? 'kleiner' : 'groter';
      grootBtn.innerHTML = siteGroot ? ICOON_KLEINER : ICOON_GROTER;
      grootBtn.title = T[sleutel];
      grootBtn.setAttribute('aria-label', T[sleutel]);
      grootBtn.setAttribute('aria-pressed', String(siteGroot));
    }
    toonGrootKnop();
    grootBtn.addEventListener('click', () => postToSite({ type: siteGroot ? 'collapse' : 'expand' }));
    window.addEventListener('message', (e) => {
      if (!EMBED || e.source !== window.parent) return;
      if (!SITE_ORIGINS.includes(e.origin) && !(LOKAAL && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(e.origin))) return;
      const d = e.data;
      if (!d || typeof d !== 'object' || d.source !== 'eazyfix-site' || d.type !== 'state') return;
      siteGroot = d.expanded === true;
      document.documentElement.classList.toggle('kan-groot', d.canExpand === true);
      toonGrootKnop();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!photoMenu.hidden) { hidePhotoMenu(); return; }
      if (EMBED) sluitChat();
    });
    inEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (sendBtn.disabled) return; document.getElementById('f').requestSubmit(); }
    });
    // Escape in een tekstveld (snelle winst 11): eerst het veld verlaten, pas een tweede
    // Escape sluit de chat. Zo sluit de chat niet per ongeluk midden in het typen.
    function escapeInVeld(e) {
      if (e.key !== 'Escape' || !photoMenu.hidden) return;
      const t = e.target;
      if (!t || !/^(TEXTAREA|INPUT)$/.test(t.tagName)) return;
      e.stopPropagation();
      t.blur();
    }
    inEl.addEventListener('keydown', escapeInVeld);
    log.addEventListener('keydown', escapeInVeld);
    // Auto-groeiend invoerveld
    inEl.addEventListener('input', () => { inEl.style.height = 'auto'; inEl.style.height = Math.min(inEl.scrollHeight, 120) + 'px'; toonTeller(); peilNaTypen(); });
    // Lichte vraag: typen zet de timer stil; een weer leeg veld laat hem opnieuw 10 seconden lopen.
    function peilNaTypen() { if (inEl.value.trim()) stopPeil(); else startPeil(); }
    // Eén grens met de server (snelle winst 10): 4000 tekens, met een tellertje vanaf 3600.
    const MAX_TEKENS = 4000;
    const tellerEl = document.getElementById('teller');
    function toonTeller() {
      const n = inEl.value.length;
      tellerEl.hidden = n < MAX_TEKENS - 400;
      tellerEl.textContent = T.tekens(n, MAX_TEKENS);
    }

    // Tijd met voorloopnul ("09:05", snelle winst 9).
    function nuTijd() {
      return new Date().toLocaleTimeString(T.locale, { hour: '2-digit', minute: '2-digit' });
    }
    // Startknopjes in de opening (review design punt 4). Op een productpagina vragen over
    // dat product; "Ik stuur een foto" opent het fotomenu in plaats van tekst te sturen.
    function startKnoppen() {
      const k = CONTEXT.product
        ? [{ tekst: T.startHoeveel, icoon: '📏' }, { tekst: T.startGebruik, icoon: '🛠️' }]
        : [{ tekst: T.startHout, icoon: '🪵' }, { tekst: T.startMuur, icoon: '🧱' }, { tekst: T.startProduct, icoon: '🛒' }];
      if (!document.documentElement.classList.contains('nofoto')) k.push({ tekst: T.startFoto, icoon: '📷', foto: true });
      return k;
    }
    // Toont de opening: één welkomstzin met startknopjes en een korte AI-noot.
    // Herbruikbaar: ook na "Nieuw gesprek".
    function toonOpening() {
      // Begroeting volgt de context van de website: product, klus of algemeen.
      const klusNaam = CONTEXT.klus && T.klussen[CONTEXT.klus];
      const vraag = CONTEXT.product ? T.vraagProduct : (klusNaam ? T.vraagKlus(klusNaam) : T.vraagAlgemeen);
      const out = bubble('bot', T.hoi + ' ' + vraag, ''); // geen tijdregel bij de opening
      renderKeuzes(out, startKnoppen(), { start: true, label: T.startGroep });
      const noot = document.createElement('div');
      noot.className = 'opening-noot';
      noot.appendChild(document.createTextNode(T.disclaimer + ' '));
      const pl = document.createElement('a');
      pl.href = SITE + '/datenschutzerklaerung/';
      pl.target = '_blank';
      pl.rel = 'noopener';
      pl.textContent = T.privacyLink;
      noot.appendChild(pl);
      log.appendChild(noot);
      log.scrollTop = 0;
      toonLeesVerder();
    }
    // Bewaard gesprek in dit tabblad? Dan dat terugzetten, anders de opening.
    const bewaard = leesGesprek();
    if (bewaard) herstelGesprek(bewaard); else toonOpening();
  </script>
</body>
</html>
