  <script>
    // Inbouwversie voor de website (iframe in eazy-fix.nl/de, JKC): pad /embed of ?embed=1.
    // Duitse bot (eazyfix-bot-de): standaardtaal Duits, land Duitsland of Oostenrijk.
    // ?foto=0 verbergt de camera (besluit van Eazyfix of foto-upload aan staat).
    // Vroeg in <head>, zodat de CSS meteen de juiste modus pakt (geen flits).
    (function () {
      var q = new URLSearchParams(location.search);
      var embed = location.pathname.replace(/\/+$/, '') === '/embed' || q.get('embed') === '1';
      if (embed) document.documentElement.classList.add('embed');
      if (q.get('foto') === '0') document.documentElement.classList.add('nofoto');
      // Contextparameters van de website (zie docs/inbouw-website-jkc.md, hoofdstuk 8).
      // De server controleert ze opnieuw; hier alleen het formaat.
      var slug = function (v, max) { v = (v || '').toLowerCase().trim(); return /^[a-z0-9\/-]+$/.test(v) && v.length <= max ? v : ''; };
      var lang = (q.get('lang') || '').toLowerCase();
      window.EF_CTX = { page: slug(q.get('page'), 120), product: slug(q.get('product'), 80), klus: slug(q.get('klus'), 20), lang: ['nl', 'en', 'de'].indexOf(lang) >= 0 ? lang : 'de', country: ['de', 'at'].indexOf((q.get('country') || '').toLowerCase()) >= 0 ? (q.get('country') || '').toLowerCase() : '' };
      document.documentElement.lang = window.EF_CTX.lang;
    })();
  </script>

  <style>
    :root {
      --navy: #000a31;
      --green: #79c143;
      --green-dark: #08210a;
      --ink: #1b2030;
      --muted: #8a90a0;
      --line: #eceef2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Manrope', system-ui, sans-serif;
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    /* Achtergrond van de losse testpagina (in het iframe niet zichtbaar) */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -2;
      /* Duitse bot: geen foto van de Nederlandse site (die toonde "REPARATIE", "VERKOOPPUNTEN"). */
      background: radial-gradient(120% 90% at 20% 10%, #24407a 0%, #0b1a44 45%, #000a31 100%);
      filter: none;
      transform: scale(1.1);
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(155deg, rgba(0,10,49,.86), rgba(0,10,49,.5) 45%, rgba(8,33,10,.66));
    }

    .chat {
      width: 100%; max-width: 540px; height: min(90vh, 800px);
      background: #fff; border-radius: 24px; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 30px 90px rgba(0,0,0,.5);
    }

    /* Kop */
    .top { background: var(--navy); color: #fff; padding: 16px 18px; display: flex; align-items: center; gap: 12px; position: relative; }
    .top .logo { height: 32px; display: block; }
    .top .title { font-size: 15px; font-weight: 700; color: #fff; }
    .top .beta { background: var(--green); color: var(--green-dark); font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
    .top .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c7ccda; }
    .top .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(121,193,67,.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(121,193,67,.6);} 70%{ box-shadow: 0 0 0 7px rgba(121,193,67,0);} 100%{ box-shadow:0 0 0 0 rgba(121,193,67,0);} }
    .gear { background: transparent; border: 0; color: #c7ccda; cursor: pointer; font-size: 16px; padding: 2px 4px; line-height: 1; }

    /* Instellingen (app-sleutel) — inklapbaar */
    .settings { background: #f6f7f9; border-bottom: 1px solid var(--line); padding: 10px 16px; font-size: 12px; color: var(--muted); display: none; }
    .settings.open { display: block; }
    .settings label { display: block; margin-bottom: 4px; }
    .settings input { width: 100%; padding: 8px 10px; border: 1px solid #d6d9e0; border-radius: 9px; font: inherit; }

    /* Berichten */
    .msgs { flex: 1; overflow-y: auto; padding: 18px 16px; background: #f6f7f9; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; gap: 9px; align-items: flex-end; }
    .row-user { justify-content: flex-end; }
    /* Duitse bot: wit EAZYFIX-icoon op donkerblauw (geen foto van Nina zoals op NL). */
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .avatar img { width: 22px; height: 22px; display: block; }
    .msg { max-width: 78%; padding: 11px 14px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .bot .msg { background: #fff; border: 1px solid var(--line); border-radius: 16px 16px 16px 5px; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .user .msg { background: var(--green); color: var(--green-dark); border-radius: 16px 16px 5px 16px; font-weight: 500; }
    .err .msg { background: #ffe3e3; color: #7a1010; border: 1px solid #ffc9c9; border-radius: 14px; }

    /* Naam + tijd onder een berichtbubbel: klein en gedempt, zoals de
       datum-scheiding hierboven. Links onder bot-berichten, rechts onder
       eigen berichten. margin-left bij bot komt overeen met avatarbreedte
       (30px) + rij-gap (9px), zodat de tekst netjes onder de bubbel begint. */
    /* Regels direct onder elkaar (vragen, losse opsomming) krijgen wat lucht, zodat een
       vraag die over twee regels loopt niet in de volgende overloopt (review 10-11-2026). */
    .msg .lsp { display: block; height: 7px; }
    .msg-meta { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .msg-meta-bot { text-align: left; margin-left: 39px; }
    .msg-meta-user { text-align: right; }

    /* Typende puntjes */
    .analyzing { color: #6b7280; font-style: italic; }
    .typing { display: inline-flex; gap: 4px; padding: 2px 0; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #b8bdc9; animation: blink 1.3s infinite both; }
    .typing span:nth-child(2){ animation-delay:.2s;} .typing span:nth-child(3){ animation-delay:.4s;}
    @keyframes blink { 0%,80%,100%{ opacity:.25; transform: translateY(0);} 40%{ opacity:1; transform: translateY(-3px);} }

    /* Stappenblok tijdens foto-analyse: loopt mee met de fase-events */
    .fases { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; }
    .fases .stap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6b7280; transition: color .2s; }
    .fases .stap.actief { color: #111827; font-weight: 500; }
    .fases .stap.klaar { color: var(--green); }
    .fases .stap .mark { width: 18px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .fases .stap .mark svg { display: block; }
    .fases .stap .mark .typing span { width: 4px; height: 4px; }

    /* Duimpjes per antwoord, TIJDELIJK terug voor de testfase (28-10-2026, verzoek Nina).
       Uitzetten: DUIMPJES_TESTFASE = false in het script. */
    .fb { display: flex; gap: 6px; align-items: center; margin: 16px 0 4px 39px; flex-wrap: wrap; }
    .fb button { display: inline-flex; align-items: center; justify-content: center; min-height: 26px; padding: 4px 9px; border: 1px solid #d6d9e0; border-radius: 9px; background: #fff; color: var(--navy); cursor: pointer; font-size: 13px; line-height: 1; }
    .fb .sel { background: var(--navy); color: #fff; border-color: var(--navy); }
    .fb .fbsend { background: var(--navy); color: #fff; border: 0; font-weight: 600; }
    .fb .fbc { flex: 1; min-width: 130px; padding: 6px 9px; border: 1px solid #d6d9e0; border-radius: 9px; font: inherit; font-size: 13px; }
    .fb .fbmsg { font-size: 12px; color: var(--muted); }

    /* Gesprek beëindigen en beoordelen (21-10-2026). De duimpjes per antwoord waren voor
       interne testers; bezoekers geven één oordeel over het hele gesprek. */
    .eindrij { display: none; justify-content: center; padding: 0 0 10px; }
    .chat.beantwoord .eindrij { display: flex; }
    .chat.beeindigd .composer { display: none; }
    .eindknop { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #c9cdd8; border-radius: 999px; padding: 7px 14px 7px 12px; font: inherit; font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer; transition: background .15s, border-color .15s; }
    .eindknop svg { color: #3f8f2a; }
    .eindknop:hover { background: #f1f3f6; border-color: var(--navy); }
    .eindknop:focus-visible, .smileys button:focus-visible, .beoordeling button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .beoordeling { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; margin: 4px 0 0 39px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .beoordeling .vraag { font-weight: 700; color: var(--ink); font-size: 16px; }
    .beoordeling .sub { font-size: 13px; color: #5f6675; margin-top: -8px; }
    .smileys { display: flex; gap: 14px; }
    .smileys button { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 4px; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
    .smileys .gezicht { width: 62px; height: 62px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 2px solid transparent; transition: transform .15s ease-out, border-color .15s, box-shadow .15s; }
    .smileys .gezicht svg { display: block; }
    .smileys .lbl { font-size: 12px; font-weight: 600; color: #5f6675; }
    .smileys [data-oordeel="blij"] .gezicht { background: #eaf6e1; color: #3f8f2a; }
    .smileys [data-oordeel="neutraal"] .gezicht { background: #fdf2d9; color: #b7730a; }
    .smileys [data-oordeel="ontevreden"] .gezicht { background: #fde8e6; color: #c23b31; }
    .smileys button:hover .gezicht { transform: translateY(-2px) scale(1.04); }
    .smileys button.sel .gezicht { border-color: currentColor; box-shadow: 0 0 0 4px rgba(0,10,49,.06); transform: scale(1.06); }
    .smileys button.sel .lbl { color: var(--ink); }
    .smileys.gekozen button:not(.sel) { opacity: .45; }
    .smileys button:disabled { cursor: default; }
    .beoordeling .toelichting { display: none; flex-direction: column; gap: 10px; width: 100%; }
    .beoordeling .toelichting.aan { display: flex; }
    .beoordeling textarea { width: 100%; box-sizing: border-box; border: 1px solid #c9cdd8; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; resize: vertical; min-height: 64px; }
    .beoordeling textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,10,49,.08); }
    .beoordeling .verstuur, .beoordeling .nieuw { align-self: flex-start; border: 0; border-radius: 12px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 700; background: var(--green); color: var(--green-dark); cursor: pointer; transition: filter .15s; }
    .beoordeling .verstuur:hover, .beoordeling .nieuw:hover { filter: brightness(.94); }
    .beoordeling button:disabled { opacity: .5; cursor: default; }
    .beoordeling .dank { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; font-weight: 600; }
    .beoordeling .dank svg { color: #3f8f2a; flex: none; }
    .beoordeling .fout { font-size: 12px; color: #b42318; }
    .beoordeling .fout:empty { display: none; }
    /* Gegevens na de gratis foto's (27-10-2026) */
    .gegevens { gap: 12px; }
    .gegevens form { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .gegevens .veld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink); }
    .gegevens .veld input { border: 1px solid #c9cdd8; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 15px; font-weight: 400; color: var(--ink); width: 100%; box-sizing: border-box; }
    .gegevens .veld input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,10,49,.08); }
    .gegevens .vink { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: var(--ink); cursor: pointer; }
    .gegevens .vink input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: var(--green); }
    .gegevens .vink a { color: var(--green-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .gegevens .verplicht { font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .smileys .gezicht, .eindknop, .beoordeling .verstuur, .beoordeling .nieuw { transition: none; }
      .smileys button:hover .gezicht, .smileys button.sel .gezicht { transform: none; }
    }

    /* Invoer */
    .composer { padding: 12px; border-top: 1px solid var(--line); background: #fff; position: relative; }
    form#f { display: flex; align-items: flex-end; gap: 8px; background: #f1f3f6; border: 1px solid #e6e9ef; border-radius: 18px; padding: 6px 6px 6px 8px; }
    .attach { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; cursor: pointer; color: var(--muted); flex: 0 0 auto; background: none; border: 0; padding: 0; -webkit-appearance: none; appearance: none; transition: background .15s, color .15s; }
    .attach:hover { background: #e6e9ef; color: var(--navy); }
    .attach.has-file { color: var(--green); }
    #photo, #photoCam { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
    .photo-menu { position: absolute; left: 12px; bottom: 64px; z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.14); padding: 6px; min-width: 180px; }
    .photo-menu[hidden] { display: none; }
    .photo-menu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 11px 12px; border-radius: 8px; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; text-align: left; }
    .photo-menu button:hover { background: #eef1f6; }
    .photo-menu svg { flex: 0 0 auto; color: var(--green); }
    textarea#in { flex: 1; border: 0; background: transparent; resize: none; font: inherit; font-size: 15px; line-height: 1.4; max-height: 120px; padding: 9px 4px; outline: none; color: var(--ink); }
    #send { width: 40px; height: 40px; flex: 0 0 auto; border: 0; border-radius: 13px; background: var(--green); color: #fff; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    #send:disabled { opacity: .5; cursor: default; }
    .credit { text-align: center; font-size: 11px; color: #aab; padding: 8px 0 2px; }
    .credit b { color: var(--muted); font-weight: 600; }

    /* Opening: datum-scheiding en deelname-kop */
    .datescheiding { text-align: center; font-size: 11px; color: #b3b9c6; margin: 8px 0 2px; }
    .opening-noot { font-size: 12px; line-height: 1.45; color: #6b7280; margin: 4px 0 14px 39px; max-width: 78%; }
    .opening-noot a { color: inherit; text-decoration: underline; }
    .deelname { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b7280; margin: 2px 0 8px; padding-left: 2px; }
    .deelname .deelname-av { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: var(--navy); }
    .deelname .deelname-av img { width: 14px; height: 14px; display: block; }


    /* Inline productlink (groene chip) in de antwoordtekst */
    .product-link {
      color: var(--green-dark); font-weight: 700; text-decoration: none;
      background: #eef7e6; border: 1px solid #cde9b3;
      border-radius: 6px; padding: 1px 6px; white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .product-link:hover { background: #e2f1d3; border-color: var(--green); }
    .site-link { color: var(--green-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    .site-link:hover { color: var(--green); }

    /* Videokaartje onder een antwoord (link naar YouTube-uitleg) */
    .videos { display: flex; flex-direction: column; gap: 6px; margin: 2px 0 0 39px; }
    .video { display: flex; align-items: stretch; gap: 0; padding: 0; overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 13.5px; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: border-color .15s, box-shadow .15s; }
    .video:hover { border-color: var(--green); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .video .vthumb { position: relative; flex: none; width: 104px; align-self: stretch; background-color: #eef0f2; overflow: hidden; }
    .video .vthumbimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .video .vthumb-fallback { background: linear-gradient(135deg, #2b2b2b, #4a4a4a); }
    .video .vplay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,0,0,.92); color: #fff; font-size: 12px; padding-left: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .video .vbody { display: flex; flex-direction: column; justify-content: center; gap: 4px; flex: 1; min-width: 0; padding: 10px 12px; }
    .video .vtxt { font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video .vcta { color: var(--green); font-weight: 700; font-size: 12.5px; }

    /* Foto in user-bubbel. De bubbel heeft een vaste breedte, zodat de foto altijd
       even groot is en niet meeschuift met de lengte van het bijschrift. Zonder die
       vaste breedte bepaalt het bijschrift de bubbelbreedte en plakt een smallere
       foto links tegen de rand. Het bijschrift loopt eronder binnen dezelfde breedte. */
    .user .msg.has-photo { padding: 5px; width: 230px; max-width: 78%; }
    /* Eén foto: de bubbel krimpt mee met de foto; het bijschrift bepaalt de breedte niet. */
    .user .msg.has-photo:not(.multi) { width: fit-content; }
    .user .msg.has-photo:not(.multi) .photo-caption { width: 0; min-width: 100%; box-sizing: border-box; }
    /* object-fit: cover is nodig, niet cosmetisch: met alleen width 100% en
       max-height wordt een heel hoge foto (bv. 1:3) platgedrukt in plaats van
       geschaald. Met cover blijft de verhouding kloppen en snijdt de bubbel de
       overhoogte netjes weg. */
    /* Eén foto heel tonen, niet bijsnijden (test Ralf, 4-11-2026: foto niet goed te zien). */
    .msg img.photo {
      width: auto; max-width: 240px; height: auto; max-height: 340px;
      border-radius: 10px; display: block;
    }
    .msg img.photo + img.photo { margin-top: 5px; }
    .msg .photo-caption { padding: 6px 7px 3px; }
    /* Meerdere foto's in één beurt: naast elkaar als tegels in plaats van een hoge stapel. */
    .msg.has-photo.multi { display: flex; flex-wrap: wrap; gap: 5px; }
    .msg.has-photo.multi img.photo { width: calc(50% - 3px); height: 105px; max-height: none; object-fit: cover; margin-top: 0; }
    .msg.has-photo.multi .photo-caption { width: 100%; }

    /* Preview van de gekozen foto, vóór verzenden */
    .preview { display: none; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 8px; background: #f1f3f6; border: 1px solid #e6e9ef; border-radius: 14px; }
    .preview.show { display: flex; }
    .preview .pthumbs { display: flex; gap: 6px; flex: 0 0 auto; }
    .preview img { width: 46px; height: 46px; object-fit: cover; border-radius: 9px; flex: 0 0 auto; }
    .preview .pname { font-size: 13px; color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview .premove { border: 0; background: #e6e9ef; color: var(--navy); width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 13px; flex: 0 0 auto; }
    .preview .premove:hover { background: #dfe3ea; }

    /* Mobiel: schermvullend, geen kaartranden, toetsenbord-/adresbalk-proof */
    @media (max-width: 600px) {
      body { padding: 0; align-items: stretch; height: 100vh; height: 100dvh; }
      .chat {
        max-width: 100%; width: 100%;
        height: 100vh; height: 100dvh; max-height: 100dvh;
        border-radius: 0; box-shadow: none;
      }
      .top { padding: 12px 14px; gap: 8px; }
      .top .logo { height: 26px; }
      .top .status { display: flex; } /* Online blijft zichtbaar op mobiel */
      .top .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* bespaart ruimte op smalle schermen */
      .msgs { padding: 14px 12px; gap: 12px; }
      .msg { max-width: 88%; font-size: 15px; }
      .composer { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
      textarea#in { font-size: 16px; } /* voorkomt automatisch inzoomen op iOS */
      .fb { margin-left: 8px; }
      .beoordeling { margin-left: 8px; }
      .credit { padding-bottom: calc(2px + env(safe-area-inset-bottom)); }
    }

    /* Inbouwversie (iframe in de website): vult het kader dat de site geeft, geen
       achtergrondfoto, geen losse kaart met ronde hoeken. De site bepaalt breedte en
       hoogte; de pagina geeft zijn gewenste hoogte door via postMessage (zie script). */
    html.embed, html.embed body { height: 100%; background: #fff; }
    html.embed body { padding: 0; align-items: stretch; justify-content: stretch; }
    html.embed body::before, html.embed body::after { display: none; }
    html.embed .chat { max-width: none; width: 100%; height: 100%; max-height: none; border-radius: 0; box-shadow: none; }
    /* ?foto=0: geen camera-knop, geen fotomenu, geen voorbeeld */
    html.nofoto .attach, html.nofoto .photo-menu, html.nofoto .preview { display: none !important; }
  </style>

    function vraagLocatieBijWeervraag(text) {

            () => { geo = null; clearTimeout(stop); klaar(); },

    // Verklein een foto client-side vóór upload: scheelt uploadtijd op mobiel,
    // blijft ruim onder de server-bodylimiet en zet meteen om naar JPEG (lost
    // ook HEIC op waar de browser die kan decoderen, o.a. iOS Safari). Lukt de
    // omzetting niet, dan valt de aanroeper terug op het originele bestand.
    function downscaleImage(file, maxDim = 1600, quality = 0.85) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) return resolve(null);
          if (Math.max(w, h) > maxDim) {
            const s = maxDim / Math.max(w, h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            if (!blob) return resolve(null);
            const r = new FileReader();
            r.onload = () => resolve({ base64: String(r.result).split(',')[1], mimeType: 'image/jpeg' });
            r.onerror = () => resolve(null);
            r.readAsDataURL(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
        img.src = url;
      });
    }

      { re: /metall[\s-]*bauspachtel/i,                      path: '/product/eazyfix-metall-bauspachtel/' },
      { re: /kunststoff[\s-]*bauspachtel/i,                  path: '/product/kunststoff-bauspachtel/' },
      { re: /kunststoff[\s-]*breitspachtel/i,                path: '/product/kunststoff-breitspachtel/' },
      { re: /metall[\s-]*schmalspachtel/i,                   path: '/product/metall-schmalspachtel/' },
      { re: /komplettes\s+holzreparaturset/i,                path: '/product/komplettes-reparaturset/' },
    ];

    // Maak elke genoemde productnaam in het antwoord klikbaar als groene chip.
    // De bot sluit een antwoord waarin hij om een foto vraagt af met de marker
    // ⟦FOTO⟧ (de mobiele apps gebruiken die om een foto-knop te tonen). Deze
    // widget heeft al een vaste foto-knop, dus we halen de marker alleen weg.
    function stripFotoMarker(s) {
      return s.replace(/\s*⟦FOTO⟧\s*/g, '').trimEnd();
    }

    // Alleen de EERSTE vermelding per product wordt een link (rustiger). Werkt
    // op het tekst-node van de bot-bubbel; HTML wordt veilig ge-escaped.
    // Na het afronden van een antwoord: een enkele regelovergang (twee regels direct onder
    // elkaar) wordt een klein tussenruimtetje, een lege regel blijft een gewone witregel.
    // Werkt op de tekstknopen van de bubbel zelf, na de linkify-stappen.
    // Opsomming zichtbaar maken (review 11-11-2026): regels die direct volgen op een regel
    // die eindigt op een dubbele punt ("Dit heb je nodig:") krijgen een bolletje, tot de
    // eerstvolgende witregel. Genummerde stappen en vragen zonder inleidende regel blijven
    // zoals ze zijn. Draait vóór de linkify-stappen, op de platte tekst van de bubbel.
    function opsommingTekst(text) {
      const regels = String(text).split('\n');
      let inLijst = false;
      for (let i = 0; i < regels.length; i++) {
        const r = regels[i];
        // Een witregel direct na de inleidende regel ("Dit heb je nodig:") hoort nog bij de lijst.
        if (!r.trim()) { if (!(inLijst && i > 0 && /:\s*$/.test(regels[i - 1]))) inLijst = false; continue; }
        if (inLijst && !/^\s*(\d+[.)]|[•\-*])\s/.test(r)) regels[i] = '• ' + r.replace(/^\s+/, '');
        else if (/^\s*\d+[.)]\s/.test(r)) inLijst = false;
        if (/:\s*$/.test(r)) inLijst = true;
      }
      return regels.join('\n');
    }
    function opsomming(answerEl) {
      if (!Array.from(answerEl.childNodes).every((n) => n.nodeType === 3)) return;
      const t = answerEl.textContent;
      const nieuw = opsommingTekst(t);
      if (nieuw !== t) answerEl.textContent = nieuw;
    }

    function regelRuimte(answerEl) {
      answerEl.normalize();
      Array.from(answerEl.childNodes).forEach((n) => {
        if (n.nodeType !== 3 || n.nodeValue.indexOf('\n') < 0) return;
        const delen = n.nodeValue.split(/(\n+)/);
        if (!delen.some((d) => d === '\n')) return;
        const frag = document.createDocumentFragment();
        for (const d of delen) {
          if (d === '\n') { const s = document.createElement('span'); s.className = 'lsp'; frag.appendChild(s); }
          else if (d) frag.appendChild(document.createTextNode(d));
        }
        answerEl.replaceChild(frag, n);
      });
    }

    function linkifyProducts(answerEl) {
      let textNode = null;
      answerEl.childNodes.forEach(n => { if (n.nodeType === 3 && !textNode) textNode = n; });
      if (!textNode) return;
      const text = textNode.nodeValue;
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // VERPLICHTE merk/kwalificatie-prefix: alleen een echte productvermelding
      // ("EAZYFIX® Premium Houtrotvuller", "EAZYFIX® Houtversterker", "Premium
      // Houtplamuur") wordt een link, en de hele naam inclusief EAZYFIX is de chip.
      // Zo wordt een los woord als "frees" of "houtvochtmeter" geen rare chip.
      const prefix = '(?:EAZYFIX[\\s®]*(?:Premium\\s*)?|Premium\\s+)';
      const alternation = PRODUCTS.map(p => '(?:' + p.re.source + ')').join('|');
      // Producten vragen de merk/kwalificatie-prefix; gereedschap (TOOLS) mag kaal.
      const toolAlt = TOOLS.map(t => '(?:' + t.re.source + ')').join('|');
      const combined = new RegExp('(?:' + prefix + '(?:' + alternation + '))|(?:' + toolAlt + ')', 'gi');
      let html = '', last = 0, m;
      while ((m = combined.exec(text)) !== null) {
        if (m.index === combined.lastIndex) { combined.lastIndex++; continue; }
        const hit = m[0];
        html += esc(text.slice(last, m.index));
        const prod = PRODUCTS.find(p => p.re.test(hit)) || TOOLS.find(t => t.re.test(hit));
        if (prod) {
          html += '<a class="product-link" href="' + SITE + prod.path + '" target="_blank" rel="noopener">' + esc(hit) + '</a>';
        } else {
          html += esc(hit);
        }
        last = m.index + hit.length;
      }
      html += esc(text.slice(last));
      const holder = document.createElement('span');
      holder.innerHTML = html;
      while (holder.firstChild) answerEl.insertBefore(holder.firstChild, textNode);
      answerEl.removeChild(textNode);
    }

    // Maak vermeldingen van onze eigen site (eazy-fix.de en eazy-fix.nl/de) klikbaar. UITSLUITEND
    // ons eigen domein; verkooppunt- of andere externe domeinen laten we met rust.
    // Draait NA linkifyProducts en loopt alle tekst-nodes af, behalve wat al in
    // een <a> zit. Trailing leestekens (punt/komma) blijven buiten de link.
    const SITE_RE = /\b((?:https?:\/\/)?(?:www\.)?eazy-fix\.(?:de|nl\/de)(?:\/[^\s<)]*)?)/gi;
    function linkifySite(answerEl) {
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const walker = document.createTreeWalker(answerEl, NodeFilter.SHOW_TEXT, null);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentNode && node.parentNode.closest && node.parentNode.closest('a')) continue;
        SITE_RE.lastIndex = 0;
        if (SITE_RE.test(node.nodeValue)) targets.push(node);
      }
      targets.forEach(tn => {
        const text = tn.nodeValue;
        let html = '', last = 0, m;
        SITE_RE.lastIndex = 0;
        while ((m = SITE_RE.exec(text)) !== null) {
          let hit = m[1], trail = '';
          const tm = hit.match(/[.,;:!?)]+$/);
          if (tm) { trail = tm[0]; hit = hit.slice(0, -trail.length); }
          const href = /^https?:\/\//i.test(hit) ? hit : 'https://' + hit;
          html += esc(text.slice(last, m.index));
          html += '<a class="site-link" href="' + href + '" target="_blank" rel="noopener">' + esc(hit) + '</a>' + esc(trail);
          last = m.index + m[1].length;
        }
        html += esc(text.slice(last));
        const holder = document.createElement('span');
        holder.innerHTML = html;
        const parent = tn.parentNode;
        while (holder.firstChild) parent.insertBefore(holder.firstChild, tn);
        parent.removeChild(tn);
      });
    }

    // Maak telefoonnummers klikbaar (tel:). Ondersteunt +31 (0)... en nationale
    // 0-nummers met spaties/streepjes. Maatvoering (2:1, 18%, 30.000, postcodes)
    // matcht bewust NIET. Draait op tekst-nodes buiten bestaande links.
    // Ook Duitse vormen: +49 / 0049 en een schuine streep als scheiding (03222 / 1097923).
    const PHONE_RE = /((?:\+31|\+49|0049)[\d\s()\/-]{8,16}\d)|(\b0\d{1,4}(?:\s?\/\s?|[\s-])?\d{2,4}[\s-]?\d{2,4}(?:[\s-]?\d{1,4})?)/g;
    function telHref(s) { return 'tel:' + s.replace(/[()\s\/-]/g, '').replace(/^0049/, '+49').replace(/^\+(31|49)0/, '+$1'); }
    function linkifyPhones(answerEl) {
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const walker = document.createTreeWalker(answerEl, NodeFilter.SHOW_TEXT, null);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentNode && node.parentNode.closest && node.parentNode.closest('a')) continue;
        PHONE_RE.lastIndex = 0;
        if (PHONE_RE.test(node.nodeValue)) targets.push(node);
      }
      targets.forEach(tn => {
        const text = tn.nodeValue;
        let html = '', last = 0, m;
        PHONE_RE.lastIndex = 0;
        while ((m = PHONE_RE.exec(text)) !== null) {
          let hit = m[0], trail = '';
          const tm = hit.match(/[.,;:!?)]+$/);
          if (tm) { trail = tm[0]; hit = hit.slice(0, -trail.length); }
          html += esc(text.slice(last, m.index));
          html += '<a class="site-link" href="' + telHref(hit) + '">' + esc(hit) + '</a>' + esc(trail);
          last = m.index + m[0].length;
        }
        html += esc(text.slice(last));
        const holder = document.createElement('span');
        holder.innerHTML = html;
        const parent = tn.parentNode;
        while (holder.firstChild) parent.insertBefore(holder.firstChild, tn);
        parent.removeChild(tn);
      });
    }

    const EMAIL_RE = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g;
    // Maakt e-mailadressen klikbaar als mailto-link.
    function linkifyEmails(answerEl) {

    // Toon klikbare videokaartje(s) met thumbnail onder een antwoord (YouTube).
    function renderVideos(answerEl, videos) {
      if (!videos || !videos.length) return;
      const wrap = document.createElement('div');
      wrap.className = 'videos';
      for (const v of videos) {
        const a = document.createElement('a');
        a.className = 'video';
        a.href = v.url; a.target = '_blank'; a.rel = 'noopener';

          + '<span class="vplay">▶</span></span>'
          + '<span class="vbody"><span class="vtxt"></span><span class="vcta">' + T.bekijkVideo + '</span></span>';
        a.querySelector('.vtxt').textContent = v.title;
        const img = a.querySelector('.vthumbimg');
        const thumbEl = a.querySelector('.vthumb');
        if (v.thumb) {
          img.onerror = () => { img.remove(); thumbEl.classList.add('vthumb-fallback'); };
          img.src = v.thumb;
        } else {
          img.remove(); thumbEl.classList.add('vthumb-fallback');

    // Duimpjes per antwoord: tijdelijk terug zolang het team test (28-10-2026, verzoek

    const ICON_DOWN = svgIcon('<path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>');
    function addFeedbackRow(question, answerEl) {

    // Gesprek beëindigen en beoordelen (21-10-2026). De duimpjes per antwoord waren
    // voor interne testers; bezoekers geven één oordeel over het hele gesprek: knop
    // "Gesprek beëindigen" (zichtbaar na het eerste antwoord), drie smileys, bij
    // neutraal of ontevreden een optionele opmerking, daarna "Nieuw gesprek".
    const chatEl = document.querySelector('.chat');
    const eindBtn = document.getElementById('eind');
    function toonEindknop() { chatEl.classList.add('beantwoord'); }
    const smiley = (mond) =>
      '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.1" fill="currentColor" stroke="none"/>'

    const SMILEYS = [

      { oordeel: 'neutraal', label: T.gingWel, svg: smiley('<path d="M8.5 15.5h7"/>') },

    function eindigGesprek() {
      if (chatEl.classList.contains('beeindigd') || sendBtn.disabled) return;
      chatEl.classList.add('beeindigd');
      photoMenu.hidden = true;
      const card = document.createElement('div');

      card.innerHTML =
        '<div class="vraag">' + T.hoeWas + '</div>'
        + '<div class="sub">' + T.helpt + '</div>'
        + '<div class="smileys">'
        + SMILEYS.map((s) => '<button type="button" data-oordeel="' + s.oordeel + '"><span class="gezicht">' + s.svg + '</span><span class="lbl">' + s.label + '</span></button>').join('')
        + '</div>'
        + '<div class="toelichting"><textarea rows="2" maxlength="1000" placeholder="' + T.watBeter + '"></textarea><button type="button" class="verstuur">' + T.verstuur + '</button></div>'
        + '<div class="fout"></div>';
      log.appendChild(card);
      scrollLog();
      postToSite({ type: 'event', name: 'chat_ended' });

      let keuze = null;
      const toelichting = card.querySelector('.toelichting');
      const tekstveld = card.querySelector('textarea');
      const fout = card.querySelector('.fout');
      const knoppen = card.querySelectorAll('.smileys button');

      async function verstuur() {

          const resp = await apiFetch('/api/feedback/gesprek', {

          card.innerHTML = '<div class="dank"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>' + T.dank + '</div><button type="button" class="nieuw">' + T.nieuw + '</button>';

        }

    eindBtn.addEventListener('click', eindigGesprek);

    function nieuwGesprek() {
      history.splice(0, history.length);
      conversationId = 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      clearPreview();

    async function sendText(text) {
      history.push({ role: 'user', content: text });
      bubble('user', text);
      postToSite({ type: 'event', name: 'message_sent' });
      const out = bubble('bot', '…');
      let acc = '';
      try {
        await vraagLocatieBijWeervraag(text);
        const resp = await apiFetch('/api/chat/stream', {
          method: 'POST',
          body: JSON.stringify({ messages: history, conversationId, geo, context: CONTEXT }),
        });
        if (!resp.ok) {
          let m = T.misgegaan;
          try { const j = await resp.json(); if (j && j.error) m = vf(j.error); } catch {}
          out.closest('.row').className = 'row row-bot err'; out.textContent = m;
          history.pop(); // mislukte user-beurt niet in de geschiedenis houden
          return;
        }
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '', videos = null;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') continue;
            try {
              const obj = JSON.parse(payload);
              if (obj.reset) { acc = ''; out.textContent = ''; }
              if (obj.status === 'tool' && !acc) { out.textContent = T.momentje; }
              if (obj.text) { acc += obj.text; out.textContent = stripFotoMarker(acc); }
              if (obj.videos) { videos = obj.videos; }
              if (obj.error) { out.closest('.row').className = 'row row-bot err'; out.textContent = vf(obj.error); }
            } catch {}
          }
          scrollLog();
        }
        if (acc) { history.push({ role: 'assistant', content: stripFotoMarker(acc) }); toonEindknop(); if (DUIMPJES_TESTFASE) addFeedbackRow(text, out); opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out); renderVideos(out, videos); postToSite({ type: 'event', name: 'answer_received' }); }
      } catch (e) {
        // Viel de verbinding weg terwijl het antwoord al binnenkwam (bv. telefoon even
        // op slot of naar een andere app), laat het antwoord tot zover dan staan in
        // plaats van het te vervangen door een rode foutmelding (test Ralf, 4-11-2026).
        if (acc) {
          const deel = stripFotoMarker(acc);
          out.textContent = deel + T.haperde;
          if (history[history.length - 1].role !== 'assistant') history.push({ role: 'assistant', content: deel });
          toonEindknop(); opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          return;
        }
        out.closest('.row').className = 'row row-bot err';
        out.textContent = T.geenVerbinding;
        history.pop(); // mislukte user-beurt niet in de geschiedenis houden
      }
    }

    // Toon de verzonden foto zelf in een user-bubbel (rij 8: afbeelding zichtbaar).
    // Optioneel bijschrift (foto + vraag in één beurt) eronder tonen.
    function userPhotoBubble(files, caption) {
      const wrap = document.createElement('div');
      wrap.className = 'bubble-wrap';
      const row = document.createElement('div');
      row.className = 'row row-user user';
      const d = document.createElement('div');
      d.className = files.length > 1 ? 'msg has-photo multi' : 'msg has-photo';
      for (const file of files) {
        const img = document.createElement('img');
        img.className = 'photo';
        img.src = URL.createObjectURL(file);
        img.onload = () => URL.revokeObjectURL(img.src);
        d.appendChild(img);
      }
      if (caption) {
        const c = document.createElement('div');
        c.className = 'photo-caption';
        c.textContent = caption;
        d.appendChild(c);
      }
      row.appendChild(d);
      wrap.appendChild(row);
      // Ook een foto-bericht van de gebruiker krijgt de naam+tijd-regel eronder.
      const meta = document.createElement('div');
      meta.className = 'msg-meta msg-meta-user';
      meta.textContent = T.verzonden + ' · ' + nuTijd();
      wrap.appendChild(meta);
      log.appendChild(wrap);
      scrollLog();
    }

    function faseLabel(phase) {
      const labels = { foto: T.fFoto, schade: T.fSchade, kennisbank: T.fKennis, advies: T.fAdvies };
      return labels[phase] || '';
    }

    // Foto-analyse via de streaming-endpoint: toont een stappenblok dat meeloopt met
    // de fase-events en laat daarna het advies binnenstromen. Valt bij stream-uitval
    // (vóór het eerste tekst-event) terug op de oude niet-streaming endpoint.
    async function sendPhoto(files, caption, opnieuw) {
      caption = (caption || '').trim();
      if (!opnieuw) {
        userPhotoBubble(files, caption);
        postToSite({ type: 'event', name: 'photo_sent' });
      }
      const out = bubble('bot', '…');

      // Bouw het stappenblok. Elke fase krijgt een regel; ze worden pas zichtbaar
      // (actief/klaar) zodra het bijbehorende event binnenkomt.
      const orde = ['foto', 'schade', 'kennisbank', 'advies'];
      const fasesEl = document.createElement('div');
      fasesEl.className = 'fases';
      const stapEls = {};
      out.innerHTML = '';
      out.appendChild(fasesEl);
      // Lijnstijl-SVG-vinkje in dezelfde stijl als de cameraknop (geen emoji). De
      // actieve stap toont de bestaande typing-dots.
      const checkSvg = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      const actiefMark = '<span class="typing"><span></span><span></span><span></span></span>';
      function toonFase(phase) {
        // Markeer alle eerder getoonde stappen als klaar, de nieuwe als actief.
        for (const p of orde) {
          if (!stapEls[p]) continue;
          stapEls[p].className = 'stap klaar';
          stapEls[p].querySelector('.mark').innerHTML = checkSvg;
        }
        if (!stapEls[phase]) {
          const el = document.createElement('div');
          el.className = 'stap';
          el.innerHTML = '<span class="mark"></span><span class="lbl"></span>';
          el.querySelector('.lbl').textContent = faseLabel(phase);
          fasesEl.appendChild(el);
          stapEls[phase] = el;
        }
        stapEls[phase].className = 'stap actief';
        stapEls[phase].querySelector('.mark').innerHTML = actiefMark;
      }

      const images = [];
      for (const file of files) {
        const reduced = await downscaleImage(file);
        images.push(reduced || { base64: await fileToBase64(file), mimeType: file.type });
      }
      const fotoLabel = '[foto: ' + files.map((f) => f.name).join(', ') + ']';
      const histLabel = files.length > 1 ? '[' + files.length + " foto's van de schade verstuurd]" : '[foto van de schade verstuurd]';

      let acc = '', gestreamd = false, klaarData = null;
      try {
        const resp = await apiFetch('/api/analyze-image/stream', {
          method: 'POST',
          body: JSON.stringify({ images, messages: history, conversationId, caption, context: CONTEXT }),
        });
        if (!resp.ok) {
          // Limiet (429) of andere nette servermelding: toon de tekst van de server
          // als chatbubbel in plaats van terug te vallen op de niet-streaming route.
          let m = '';
          let j = null;
          try { j = await resp.json(); m = vf((j && j.error) || ''); } catch {}
          if (resp.status === 403 && j && j.leadRequired) { out.textContent = m; vraagGegevens(files, caption); return; }
          if (resp.status === 429 && m) { out.closest('.row').className = 'row row-bot err'; out.textContent = m; return; }
          throw new Error('stream ' + resp.status);
        }
        if (!resp.body) throw new Error('stream zonder body');
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue; // heartbeat (': ping') wordt zo genegeerd
            let obj; try { obj = JSON.parse(line.slice(6)); } catch { continue; }
            if (obj.phase) { toonFase(obj.phase); }
            if (obj.error) { throw new Error(vf(obj.error)); }
            if (obj.reset) { acc = ''; if (gestreamd) out.textContent = ''; }
            if (typeof obj.text === 'string') {
              if (!gestreamd) { gestreamd = true; out.innerHTML = ''; } // stappenblok weg bij eerste tekst
              acc += obj.text;
              out.textContent = stripFotoMarker(acc);
            }
            if (obj.done) { klaarData = obj; }
          }
        }
        if (!gestreamd && !klaarData) throw new Error('stream leeg');

        if (klaarData) {
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          history.push({ role: 'user', content: caption ? histLabel + ' ' + caption : histLabel });
          history.push({ role: 'assistant', content: acc });
          toonEindknop();
          if (DUIMPJES_TESTFASE) addFeedbackRow(caption ? fotoLabel + ' ' + caption : fotoLabel, out);
          renderVideos(out, klaarData.videos);
          postToSite({ type: 'event', name: 'answer_received' });
        } else {
          // Er kwam wel tekst binnen, maar nooit een {done}-event: mogelijk afgekapt.
          out.textContent = stripFotoMarker(acc) + T.haperde;
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          toonEindknop();
        }
      } catch (e) {
        // Kwam er al tekst binnen, laat die staan met een korte notitie. Anders val
        // terug op de oude niet-streaming endpoint zodat de klusser altijd antwoord krijgt.
        if (gestreamd && acc) {
          out.textContent = stripFotoMarker(acc) + T.haperde;
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          toonEindknop();
          return;
        }
        try {
          const resp = await apiFetch('/api/analyze-image', {
            method: 'POST',
            body: JSON.stringify({ images, messages: history, conversationId, caption, context: CONTEXT }),
          });
          const data = await resp.json();
          if (resp.status === 403 && data.leadRequired) { out.textContent = vf(data.error); vraagGegevens(files, caption); return; }
          if (!resp.ok) { out.closest('.row').className = 'row row-bot err'; out.textContent = vf(data.error) || ('Fout ' + resp.status); return; }
          // Server levert al schone tekst; flow/productIds zijn techniek, NIET tonen.
          out.textContent = data.content;
          history.push({ role: 'user', content: caption ? histLabel + ' ' + caption : histLabel });
          history.push({ role: 'assistant', content: data.content });
          toonEindknop();
          if (DUIMPJES_TESTFASE) addFeedbackRow(caption ? fotoLabel + ' ' + caption : fotoLabel, out);
          opsomming(out); linkifyProducts(out); linkifySite(out); linkifyPhones(out); linkifyEmails(out); regelRuimte(out);
          renderVideos(out, data.videos);
        } catch (e2) {
          out.closest('.row').className = 'row row-bot err';
          out.textContent = 'Fout: ' + e2.message;
        }
      }
    }

    // Gegevensformulier na de gratis foto's (wens van Nina, Eazyfix, 27-10-2026). De
    // server bepaalt wanneer (403 met leadRequired). Na het invullen gaat dezelfde foto
    // alsnog door de analyse. Mailchimp-koppeling volgt later via de server.
    function vraagGegevens(files, caption) {
      const card = document.createElement('div');
      card.className = 'beoordeling gegevens';
      card.innerHTML =
        '<form novalidate>'
        + '<label class="veld">' + T.naam + '*<input name="naam" autocomplete="name" maxlength="100" required></label>'
        + '<label class="veld">' + T.email + '*<input name="email" type="email" autocomplete="email" maxlength="200" required></label>'
        + '<label class="vink"><input type="checkbox" name="akkoord"><span>' + T.akkoord + '* <a href="' + SITE + '/datenschutzerklaerung/" target="_blank" rel="noopener">' + T.privacy + '</a></span></label>'
        + '<label class="vink"><input type="checkbox" name="nieuwsbrief"><span>' + T.nieuwsbrief + '</span></label>'
        + '<div class="verplicht">' + T.verplicht + '</div>'
        + '<div class="fout" role="alert"></div>'
        + '<button type="submit" class="verstuur">' + T.verderFoto + '</button>'
        + '</form>';
      log.appendChild(card);
      scrollLog();
      const form = card.querySelector('form');
      const fout = card.querySelector('.fout');
      form.naam.focus();
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        fout.textContent = '';
        const naam = form.naam.value.trim();
        const email = form.email.value.trim();
        if (!naam) { fout.textContent = T.vulNaam; form.naam.focus(); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { fout.textContent = T.vulEmail; form.email.focus(); return; }
        if (!form.akkoord.checked) { fout.textContent = T.geefAkkoord; return; }
        const knop = form.querySelector('.verstuur');
        knop.disabled = true;
        try {
          const resp = await apiFetch('/api/lead', {
            method: 'POST',
            body: JSON.stringify({ naam, email, akkoord: true, nieuwsbrief: form.nieuwsbrief.checked, conversationId }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.token) throw new Error(data.error || T.opslaanFout);
          leadToken = data.token;
          try { localStorage.setItem('eazyfix-lead', leadToken); } catch {}
          postToSite({ type: 'event', name: 'lead_given' });
          card.innerHTML = '<div class="dank"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg><span></span></div>';
          card.querySelector('.dank span').textContent = T.bedanktNaam(naam);
          scrollLog();
          sendBtn.disabled = true;
          try { await sendPhoto(files, caption, true); } finally { sendBtn.disabled = false; }
        } catch (err) {
          knop.disabled = false;
          fout.textContent = err.message;
        }
      });
    }

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sendBtn.disabled) return; // al een beurt bezig: geen tweede parallelle request
      sendBtn.disabled = true;
      try {
        const text = inEl.value.trim();
        inEl.value = ''; inEl.style.height = 'auto';
        if (pendingPhotos.length) {
          // Foto (met of zonder tekst): één beurt, één antwoord. Tekst gaat mee als
          // bijschrift, niet als losse tweede chat-request.
          const f = pendingPhotos; clearPreview();
          await sendPhoto(f, text);
        } else if (text) {
          await sendText(text);
        }
      } finally { sendBtn.disabled = false; inEl.focus(); }
    });
    inEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (sendBtn.disabled) return; document.getElementById('f').requestSubmit(); }
    });
    // Auto-groeiend invoerveld
    inEl.addEventListener('input', () => { inEl.style.height = 'auto'; inEl.style.height = Math.min(inEl.scrollHeight, 120) + 'px'; });

    // Toont de opening: datum-scheiding, deelname-kop en het openingsbericht met de
    // AI-waarschuwing. Herbruikbaar: ook na "Chat beeindigen".
    function nuTijd() {
      return new Date().toLocaleTimeString(T.locale, { hour: 'numeric', minute: '2-digit' });
    }
    function toonOpening() {
      const t = nuTijd();
      const scheiding = document.createElement('div');
      scheiding.className = 'datescheiding';
      scheiding.textContent = T.vandaag + ' · ' + t;
      log.appendChild(scheiding);
      const deelname = document.createElement('div');
      deelname.className = 'deelname';
      const deelAv = document.createElement('span');
      deelAv.className = 'deelname-av';
      const deelImg = document.createElement('img');
      deelImg.src = '/bot-avatar-de.png';
      deelImg.alt = 'EAZYFIX';
      deelImg.onerror = () => { deelAv.remove(); };
      deelAv.appendChild(deelImg);
      const deelTxt = document.createElement('span');
      deelTxt.textContent = T.neemtDeel + ' · ' + t;
      deelname.appendChild(deelAv);
      deelname.appendChild(deelTxt);
      log.appendChild(deelname);
      const metFoto = !document.documentElement.classList.contains('nofoto');
      // Begroeting volgt de context van de website: product, klus of algemeen.
      const klusNaam = CONTEXT.klus && T.klussen[CONTEXT.klus];
      const vraag = CONTEXT.product ? T.vraagProduct : (klusNaam ? T.vraagKlus(klusNaam) : T.vraagAlgemeen);
      bubble('bot', T.hoi + ' ' + vraag + (metFoto ? T.ofFoto : T.zonderFoto));
      const noot = document.createElement('div');
      noot.className = 'opening-noot';
      noot.appendChild(document.createTextNode(T.disclaimer + ' '));
      const pl = document.createElement('a');
      pl.href = SITE + '/datenschutzerklaerung/';
      pl.target = '_blank';
      pl.rel = 'noopener';
      pl.textContent = T.privacyLink;
      noot.appendChild(pl);
      log.appendChild(noot);
    }
    toonOpening();
  </script>
</body>
